<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地震工程工作台 · Seismic Lab</title>
<meta name="description" content="浏览器里跑完一条真实强震记录：反应谱、单自由度时程、多层结构振型分解与 Newmark 时程、GB 50011 / ASCE 7 / EN 1998 三本规范的设计谱与静力法校核。引擎逐点对拍 OpenSees 与 eqsig。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<style>
/* 本站硬规矩：作者 CSS 与 UA 的 [hidden]{display:none} 同特异性，靠后即胜出，
   会让 JS 里的 el.hidden = true 彻底失效。这一条必须排在最前面。 */
[hidden]{display:none!important}

/* ── 设计语言：MiniMax ──────────────────────────────────────────────
   纯白画布 + 近黑排版，靠 80px 超大字号与 -2px 负字距立主张；
   每条地震记录拿一张 32px 圆角的**饱和渐变卡**（对应 MiniMax 给每个模型
   发布配一张色卡的做法）；按钮与页签一律胶囊；文档区走
   「左侧导航 / 中间正文 / 右侧目录」三栏；表格与密集控件才用直角。 */
:root{
  --ink:#0a0a0a; --ink-strong:#000; --charcoal:#222; --slate:#45515e; --steel:#5f5f5f;
  --stone:#8e8e93; --muted:#a8aab2; --canvas:#fff; --surface:#f7f8fa; --surface-soft:#f2f3f5;
  --hairline:#e5e7eb; --hairline-soft:#eaecf0;
  --coral:#ff5530; --magenta:#ea5ec1; --blue:#1456f0; --blue-deep:#1d4ed8; --blue-200:#bfdbfe;
  --cyan:#3daeff; --purple:#a855f7; --success-bg:#e8ffea; --success-text:#1ba673; --danger:#d45656;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-hero:32px; --r-full:9999px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);
  font-family:'DM Sans','Inter',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
.sq-wrap{max-width:1360px;margin:0 auto;padding:0 16px}

/* 顶栏 */
.sq-top{border-bottom:1px solid var(--hairline);background:var(--canvas);position:sticky;top:0;z-index:30}
.sq-top .sq-wrap{display:flex;align-items:center;gap:16px;height:60px}
.sq-back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;font-weight:500;
  color:var(--ink);border:1px solid var(--hairline);border-radius:var(--r-full);padding:8px 16px;background:var(--canvas)}
.sq-back:hover{background:var(--surface)}
.sq-top-name{font-size:14px;font-weight:600;letter-spacing:-.2px}
.sq-top-tag{font-size:12px;color:var(--stone);border:1px solid var(--hairline);border-radius:var(--r-full);padding:3px 10px}
.sq-spacer{flex:1 1 auto;min-width:0}

/* Hero */
.sq-hero{padding:56px 0 24px}
.sq-hero h1{font-size:clamp(40px,7vw,80px);line-height:1.1;letter-spacing:-2px;font-weight:600}
.sq-hero p{margin:16px 0 0;font-size:18px;font-weight:500;line-height:1.5;color:var(--slate);max-width:60ch}
.sq-hero-meta{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px}
.sq-chip{font-size:13px;font-weight:600;border-radius:var(--r-full);padding:4px 10px;background:var(--surface);color:var(--steel)}
.sq-chip.sq-chip-on{background:var(--blue-200);color:var(--blue-deep)}

/* 页签 */
.sq-tabs{position:sticky;top:60px;z-index:20;background:var(--canvas);border-bottom:1px solid var(--hairline);
  padding:12px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.sq-tabs .sq-wrap{display:flex;gap:8px;min-width:max-content}
.sq-tab{border:1px solid var(--hairline);background:var(--canvas);color:var(--steel);
  border-radius:var(--r-full);padding:8px 16px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.sq-tab:hover{background:var(--surface)}
.sq-tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.sq-tab:focus-visible,.sq-back:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--blue-deep);outline-offset:2px}

/* 布局：左控制栏 / 中图 / 右读数 */
.sq-pane{padding:28px 0 72px}
.sq-grid{display:grid;grid-template-columns:288px minmax(0,1fr);gap:24px;align-items:start}
.sq-grid3{display:grid;grid-template-columns:288px minmax(0,1fr) 296px;gap:24px;align-items:start}
.sq-grid>*,.sq-grid3>*{min-width:0}
.sq-rail{position:sticky;top:132px;display:flex;flex-direction:column;gap:16px}
.sq-col{display:flex;flex-direction:column;gap:20px;min-width:0}

/* 卡片 */
.sq-card{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-xl);padding:24px;min-width:0}
.sq-card.sq-quiet{background:var(--surface);border-color:transparent;padding:32px}
.sq-card h2{font-size:24px;letter-spacing:-.5px;line-height:1.3}
.sq-card h3{font-size:20px;letter-spacing:-.2px;line-height:1.4}
.sq-lede{margin:8px 0 0;font-size:14px;color:var(--steel);line-height:1.5}
.sq-sec-title{font-size:13px;font-weight:600;color:var(--steel);letter-spacing:.4px;margin:0 0 12px}

/* 渐变记录卡（MiniMax 的模型色卡） */
.sq-recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.sq-rec{position:relative;border:0;text-align:left;cursor:pointer;color:#fff;border-radius:var(--r-hero);
  padding:24px;min-height:168px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-width:0}
.sq-rec-0{background:linear-gradient(145deg,#ff7a4d 0%,#ff5530 55%,#d93b18 100%)}
.sq-rec-1{background:linear-gradient(145deg,#3daeff 0%,#1456f0 60%,#17437d 100%)}
.sq-rec-2{background:linear-gradient(145deg,#f27bd4 0%,#ea5ec1 55%,#a2338a 100%)}
.sq-rec-3{background:linear-gradient(145deg,#c084fc 0%,#a855f7 55%,#6b21a8 100%)}
.sq-rec-4{background:linear-gradient(145deg,#5ec8b8 0%,#1ba673 60%,#0d6b4a 100%)}
.sq-rec-5{background:linear-gradient(145deg,#4b5563 0%,#181e25 60%,#0a0a0a 100%)}
.sq-rec-ev{font-size:18px;font-weight:600;line-height:1.3;letter-spacing:-.3px}
.sq-rec-st{font-size:13px;line-height:1.5;opacity:.82}
.sq-rec-num{font-size:32px;font-weight:600;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.sq-rec-num span{font-size:14px;font-weight:500;letter-spacing:0;opacity:.8;margin-left:4px}
.sq-rec-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sq-rec-dur{font-size:12px;opacity:.82;text-align:right;line-height:1.5;font-variant-numeric:tabular-nums}
.sq-rec[aria-pressed="true"]{box-shadow:0 0 0 2px var(--canvas),0 0 0 5px var(--ink)}
/* 选中卡右上角有「当前」徽标，标题必须给它让出位置，否则两行汉字会压到徽标下面 */
.sq-rec[aria-pressed="true"] .sq-rec-ev{padding-right:52px}
.sq-rec-pick{position:absolute;top:16px;right:16px;font-size:11px;font-weight:600;background:rgba(255,255,255,.92);
  color:var(--ink);border-radius:var(--r-full);padding:3px 9px}

/* 控件 */
.sq-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.sq-field>label{font-size:13px;font-weight:600;color:var(--steel)}
.sq-hint{font-size:12px;color:var(--stone);line-height:1.5}
input[type=text],input[type=number],select,textarea{background:var(--canvas);border:1px solid var(--hairline);
  border-radius:var(--r-md);padding:9px 12px;min-height:40px;width:100%;min-width:104px;font-size:14px}
select{min-height:40px;-webkit-appearance:none;appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--steel) 50%),linear-gradient(135deg,var(--steel) 50%,transparent 50%);
  background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea{min-height:120px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--blue-deep);outline:none;box-shadow:0 0 0 1px var(--blue-deep)}
input[type=range]{width:100%;min-width:120px;height:22px;accent-color:var(--ink);background:transparent;padding:0;border:0;min-height:0}
.sq-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sq-row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sq-row>*,.sq-row3>*{min-width:0}
.sq-check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--charcoal)}
.sq-check input{width:18px;height:18px;min-width:18px;min-height:18px;accent-color:var(--ink);margin:0}
.sq-btn{border-radius:var(--r-full);padding:11px 24px;font-size:14px;font-weight:600;cursor:pointer;
  min-width:64px;background:var(--ink);color:#fff;border:1px solid var(--ink)}
.sq-btn:hover{background:var(--charcoal);border-color:var(--charcoal)}
.sq-btn.sq-ghost{background:var(--canvas);color:var(--ink);border:1px solid var(--ink)}
.sq-btn.sq-ghost:hover{background:var(--surface)}
.sq-btn.sq-soft{background:var(--canvas);color:var(--ink);border:1px solid var(--hairline)}
.sq-btn.sq-soft:hover{background:var(--surface)}
.sq-btns{display:flex;flex-wrap:wrap;gap:8px}

/* 徽标 */
.sq-badge{display:inline-block;font-size:13px;font-weight:600;border-radius:var(--r-full);padding:4px 10px}
.sq-badge-ok{background:var(--success-bg);color:var(--success-text)}
.sq-badge-no{background:#ffecec;color:#b42318}
.sq-badge-info{background:var(--blue-200);color:var(--blue-deep)}
.sq-badge-warn{background:#fff3d6;color:#8a5a00}

/* 读数 */
.sq-kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px;align-items:baseline}
.sq-kv dt{color:var(--steel);min-width:0}
.sq-kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.sq-big{font-size:40px;font-weight:600;letter-spacing:-1px;line-height:1.1;font-variant-numeric:tabular-nums}
.sq-big small{font-size:14px;font-weight:500;letter-spacing:0;color:var(--steel);margin-left:6px}

/* 表 */
.sq-tw{overflow-x:auto;border:1px solid var(--hairline);border-radius:var(--r-md);min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:0}
thead th{background:var(--surface);color:var(--steel);font-size:13px;font-weight:600;text-align:right;
  padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--hairline)}
thead th:first-child{text-align:left}
tbody td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--hairline-soft);
  font-variant-numeric:tabular-nums}
tbody td:first-child{text-align:left;font-variant-numeric:normal}
tbody tr:last-child td{border-bottom:0}
tbody tr.sq-hl td{background:#fff8f1}

/* 图 */
.sq-fig{width:100%;height:auto;display:block;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-md)}
.sq-figcap{font-size:12px;color:var(--stone);margin-top:8px;line-height:1.5}
.sq-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--steel)}
.sq-legend i{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* 深色条（MiniMax 的黑色 promo 条），只放结论 */
.sq-strip{background:var(--ink);color:#fff;border-radius:var(--r-hero);padding:32px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:24px}
.sq-strip>div{min-width:0}
.sq-strip dt{font-size:13px;color:var(--muted);margin-bottom:6px}
.sq-strip dd{margin:0;font-size:28px;font-weight:600;letter-spacing:-.8px;font-variant-numeric:tabular-nums;line-height:1.2}
.sq-strip dd small{font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:5px}

/* 提示 / 错误 */
.sq-note{border-left:3px solid var(--blue);background:var(--surface);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:12px 16px;font-size:13px;color:var(--charcoal);line-height:1.6}
.sq-note.sq-bad{border-left-color:var(--danger);background:#fff6f6}
.sq-prose{font-size:15px;color:var(--charcoal);line-height:1.7}
.sq-prose p{margin:0 0 14px}
.sq-prose ul{margin:0 0 14px;padding-left:20px}
.sq-prose li{margin:0 0 8px}
.sq-prose code{background:var(--surface);border-radius:var(--r-sm);padding:2px 6px;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.sq-toc{position:sticky;top:132px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.sq-toc a{color:var(--steel);text-decoration:none;padding:4px 0}
.sq-toc a:hover{color:var(--ink)}
.sq-foot{border-top:1px solid var(--hairline);padding:32px 0 56px;color:var(--stone);font-size:13px;line-height:1.7}

@media (max-width:1100px){
  .sq-grid,.sq-grid3{grid-template-columns:minmax(0,1fr)}
  .sq-rail,.sq-toc{position:static}
}
@media (max-width:640px){
  .sq-hero{padding:32px 0 16px}
  .sq-card{padding:18px}
  .sq-card.sq-quiet{padding:20px}
  .sq-strip{padding:20px}
  .sq-row3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="sq-top"><div class="sq-wrap">
  <a class="sq-back" href="../../">← 返回工具集</a>
  <span class="sq-top-name">Seismic Lab</span>
  <span class="sq-spacer"></span>
  <span class="sq-top-tag" id="sq-top-tag">引擎对拍 OpenSees</span>
</div></div>

<header class="sq-wrap sq-hero">
  <h1>地震工程<br>工作台</h1>
  <p>挑一条真实强震记录，页内算完反应谱、单自由度时程、多层结构的振型分解与 Newmark 时程，再拿 GB 50011 / ASCE 7 / EN 1998 三本规范当场校核。全部在浏览器里跑，不上传任何数据。</p>
  <div class="sq-hero-meta">
    <span class="sq-chip sq-chip-on">6 条公开档案记录</span>
    <span class="sq-chip">Nigam-Jennings 精确解</span>
    <span class="sq-chip">Newmark-β 时程</span>
    <span class="sq-chip">SRSS / CQC</span>
    <span class="sq-chip">三本规范设计谱</span>
    <span class="sq-chip">可粘自有记录</span>
  </div>
</header>

<nav class="sq-tabs" aria-label="功能分区"><div class="sq-wrap" id="sq-tabs" role="tablist"></div></nav>

<main class="sq-wrap">
  <div id="sq-panes"></div>
</main>

<footer class="sq-wrap sq-foot">
  <p id="sq-foot-note"></p>
</footer>

  function drawHusid(m, im) {
    var n = im.husid.length, F = new AEPlot.Frame('fig-husid', { pad: { l: 52, r: 14, t: 14, b: 34 } });
    F.setDomain(0, (n - 1) * m.dt, 0, 100);
    F.axes({ xlabel: '时间 t (s)', ylabel: 'Arias 强度累积 (%)', xfmt: function (v) { return fmt(v, 0); },
             yfmt: function (v) { return fmt(v, 0); } });
    AEPlot.el('rect', { x: F.sx(im.t5), y: F.y1, width: Math.max(1, F.sx(im.t95) - F.sx(im.t5)),
      height: F.y0 - F.y1, fill: 'rgba(20,86,240,.07)' }, F.svg);
    var pts = [], i, tot = im.husid[n - 1] || 1;
    var step = Math.max(1, Math.floor(n / 700));
    for (i = 0; i < n; i += step) pts.push([i * m.dt, im.husid[i] / tot * 100]);
    pts.push([(n - 1) * m.dt, 100]);
    F.path(pts, { stroke: C.blue, width: 1.8 });
    F.hline(5, { stroke: '#cfd4dc' }); F.hline(95, { stroke: '#cfd4dc' });
    var mx = F.sx((im.t5 + im.t95) / 2);
    F.P.text(mx, F.sy(50), 'D5-95 = ' + fmt(im.d595, 1) + ' s', { size: 11, fill: C.ink, plate: true, anchor: 'middle',
      offsets: [[0, 0], [0, -18], [0, 18], [0, -36]] });
  }
  function drawFAS(m) {
    var fa = SQ.fourierAmp(m.acc, m.dt), i;
    var F = new AEPlot.Frame('fig-fas', { pad: { l: 54, r: 14, t: 14, b: 34 } });
    var fmin = 0.1, fmax = Math.min(30, 0.45 / m.dt);
    var amax = 0;
    for (i = 1; i < fa.f.length; i++) if (fa.f[i] >= fmin && fa.f[i] <= fmax && fa.amp[i] > amax) amax = fa.amp[i];
    F.setDomain(Math.log(fmin) / Math.LN10, Math.log(fmax) / Math.LN10, 0, amax * 1.1 || 1);
    var xt = AEPlot.logTicks(Math.log(fmin) / Math.LN10, Math.log(fmax) / Math.LN10).map(function (v) { return Math.log(v) / Math.LN10; });
    F.axes({ xlabel: '频率 (Hz)', ylabel: '|A(f)| (m/s)', xticks: xt,
             xfmt: function (v) { var t = Math.pow(10, v); return t >= 1 ? fmt(t, 0) : fmt(t, 1); },
             yfmt: function (v) { return fmt(v, 2); } });
    var pts = [], step = Math.max(1, Math.floor(fa.f.length / 1400));
    for (i = 1; i < fa.f.length; i += step) {
      if (fa.f[i] < fmin || fa.f[i] > fmax) continue;
      pts.push([Math.log(fa.f[i]) / Math.LN10, fa.amp[i]]);
    }
    F.path(pts, { stroke: C.magenta, width: 1 });
    var tm = SQ.meanPeriod(fa);
    if (tm > 0 && 1 / tm >= fmin && 1 / tm <= fmax) {
      var lx = Math.log(1 / tm) / Math.LN10;
      F.vline(lx, { stroke: C.ink });
      F.P.text(F.sx(lx), F.y1 + 18, '平均周期 Tm = ' + fmt(tm, 2) + ' s', { size: 11, fill: C.ink, plate: true,
        anchor: 'middle', offsets: [[0, 0], [0, 16], [-60, 0], [60, 0]] });
    }
  }
  function renderIM(m, im) {
    var fa = SQ.fourierAmp(m.acc, m.dt), tm = SQ.meanPeriod(fa);
    var sp = A.specAt(0.05);
    var si = SQ.spectralIntensity(sp, 0.1, 2.5, 'psv');
    var asi = SQ.spectralIntensity(sp, 0.1, 0.5, 'psa');
    var rows = [
      ['峰值加速度 PGA', fmt(im.pga, 3) + ' m/s²', fmt(im.pga / G, 4) + ' g'],
      ['峰值速度 PGV', fmt(im.pgv * 100, 2) + ' cm/s', 'PGV/PGA = ' + fmt(im.pgv / im.pga, 3) + ' s'],

      ['显著持时 D5-75', fmt(im.d575, 2) + ' s', '—'],
      ['平均周期 Tm', fmt(tm, 3) + ' s', 'Rathje 口径，0.25–20 Hz'],

    var html = '<thead><tr><th>指标</th><th>数值</th><th>备注</th></tr></thead><tbody>';
    rows.forEach(function (r) { html += '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>'; });
    $('mo-im').innerHTML = html + '</tbody>';
  }

    $('gb-int').value = S.gb.intensity; $('gb-lv').value = S.gb.level; $('gb-site').value = S.gb.site; $('gb-grp').value = S.gb.group;
    $('as-ss').value = S.asce.Ss; $('as-s1').value = S.asce.S1; $('as-site').value = S.asce.site; $('as-tl').value = S.asce.TL;
    $('ec-ag').value = S.ec8.ag; $('ec-type').value = S.ec8.type; $('ec-site').value = S.ec8.site;
    $('sd-t').value = S.sdofT; $('sd-t-num').value = S.sdofT; $('sd-z').value = S.sdofZeta;
  }
  A.syncInputs = syncInputs;

  function bind() {
    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-tab],[data-rec],button') : null;
      if (!t) return;
      if (t.hasAttribute && t.hasAttribute('data-tab')) { show(t.getAttribute('data-tab')); return; }
      if (t.hasAttribute && t.hasAttribute('data-rec')) {
        S.recId = t.getAttribute('data-rec'); A.cache.procKey = null; render(); A.save(); return;
      }
      switch (t.id) {
        case 'st-reset': A.rebuildLists(); A.cache.mdlKey = null; render(); A.save(); break;
        case 'sd-peak': S.sdofT = +A.peakT(A.specAt(0.05)).toFixed(2); render(); A.save(); break;
        case 'mo-load': loadCustom(); break;
        case 'mo-demo': fillDemo(); break;
        case 'ck-share': doShare(); break;
      }
    });
    document.addEventListener('input', onChange);
    document.addEventListener('change', onChange);
  }
  function onChange(e) {
    var t = e.target;
    if (!t || !t.id && !t.hasAttribute('data-zeta') && !t.classList.contains('sq-edit')) return;
    if (t.classList && t.classList.contains('sq-edit')) {
      var i = +t.getAttribute('data-i'), kind = t.getAttribute('data-kind'), v = parseFloat(t.value);
      if (isFinite(v) && v > 0) {
        if (kind === 'm') S.mList[i] = v; else if (kind === 'k') S.kList[i] = v; else S.hList[i] = v;
        A.cache.mdlKey = null; A.schedule();
      }
      return;
    }
    if (t.hasAttribute && t.hasAttribute('data-zeta')) {
      var z = parseFloat(t.getAttribute('data-zeta'));
      var idx = S.specZetas.indexOf(z);
      if (t.checked && idx < 0) S.specZetas.push(z);
      if (!t.checked && idx >= 0 && S.specZetas.length > 1) S.specZetas.splice(idx, 1);
      S.specZetas.sort(function (a, b) { return a - b; });
      A.cache.specKey = null; A.schedule(); return;
    }
    switch (t.id) {
      case 'mo-detrend': S.detrend = +t.value; A.cache.procKey = null; A.schedule(); break;
      case 'mo-hp': S.hp = num('mo-hp', 0.01, 2, 0.05); A.cache.procKey = null; A.schedule(); break;
      case 'mo-lp': S.lp = num('mo-lp', 5, 48, 25); A.cache.procKey = null; A.schedule(); break;
      case 'mo-order': S.order = +t.value; A.cache.procKey = null; A.schedule(); break;
      case 'mo-scale': S.scaleMode = t.value; $('mo-pga-wrap').hidden = S.scaleMode !== 'pga'; A.cache.procKey = null; A.schedule(); break;
      case 'mo-pga': S.scalePGA = num('mo-pga', 0.01, 2, 0.3); A.cache.procKey = null; A.schedule(); break;
      case 'sp-quan': S.specQuan = t.value; A.schedule(); break;
      case 'sp-axis': S.specAxis = t.value; A.schedule(); break;
      case 'cd-code': S.code = t.value; syncInputs(); A.schedule(); break;
      case 'gb-int': S.gb.intensity = t.value; A.schedule(); break;
      case 'gb-lv': S.gb.level = t.value; A.schedule(); break;
      case 'gb-site': S.gb.site = t.value; A.schedule(); break;
      case 'gb-grp': S.gb.group = t.value; A.schedule(); break;
      case 'as-ss': S.asce.Ss = num('as-ss', 0.05, 3, 1.5); A.schedule(); break;
      case 'as-s1': S.asce.S1 = num('as-s1', 0.02, 1.5, 0.6); A.schedule(); break;
      case 'as-site': S.asce.site = t.value; A.schedule(); break;
      case 'as-tl': S.asce.TL = num('as-tl', 4, 16, 8); A.schedule(); break;
      case 'ec-ag': S.ec8.ag = num('ec-ag', 0.02, 1, 0.25); A.schedule(); break;
      case 'ec-type': S.ec8.type = t.value; A.schedule(); break;
      case 'ec-site': S.ec8.site = t.value; A.schedule(); break;
      case 'sd-t': S.sdofT = parseFloat(t.value); A.schedule(); break;
      case 'sd-t-num': S.sdofT = num('sd-t-num', 0.02, 6, 1); A.schedule(); break;
      case 'sd-z': S.sdofZeta = parseFloat(t.value); A.schedule(); break;
      case 'st-n': S.bld.stories = Math.round(num('st-n', 1, 40, 10)); A.rebuildLists(); A.cache.mdlKey = null; A.schedule(); break;
      case 'st-h': S.bld.height = num('st-h', 2, 8, 3.3); A.rebuildLists(); A.cache.mdlKey = null; A.schedule(); break;
      case 'st-m': S.bld.mass = num('st-m', 10, 5000, 320); A.rebuildLists(); A.cache.mdlKey = null; A.schedule(); break;
      case 'st-k': S.bld.stiff = num('st-k', 1000, 5000000, 220000); A.rebuildLists(); A.cache.mdlKey = null; A.schedule(); break;
      case 'st-taper': S.bld.taper = parseFloat(t.value); A.rebuildLists(); A.cache.mdlKey = null; A.schedule(); break;
      case 'st-z': S.zeta = parseFloat(t.value); A.schedule(); break;
      case 'st-comb': S.comb = t.value; A.schedule(); break;
      case 'st-sub': S.sub = +t.value; A.schedule(); break;
      case 'ck-kind': S.gb.kind = t.value; A.schedule(); break;
      case 'ck-R': S.asce.R = num('ck-R', 1, 12, 8); A.schedule(); break;
      case 'ck-ta': S.asce.ta = t.value; A.schedule(); break;
    }
  }
  function loadCustom() {
    var msg = $('mo-parse');
    try {
      var r = A.parseRecord($('mo-text').value, $('mo-unit').value, parseFloat($('mo-dt').value));
      S.custom = { id: 'custom', event: '自有记录', station: '粘贴导入', site: '—', dist: null,
                   dt: r.dt, n: r.acc.length, acc: r.acc, src: '用户粘贴 @ —' };
      S.recId = 'custom'; A.cache.procKey = null;
      msg.textContent = '已载入 ' + r.acc.length + ' 点，dt = ' + r.dt + ' s，时长 '
        + fmt((r.acc.length - 1) * r.dt, 2) + ' s，PGA = ' + fmt(SQ.peakAbs(r.acc) / G, 4) + ' g。';
      render(); A.save();
    } catch (err) {
      msg.textContent = '解析失败：' + (err && err.message ? err.message : err);
    }
  }
  function fillDemo() {
    var m = A.motion(), i, lines = [], n = Math.min(m.acc.length, 3000);
    lines.push('NPTS=  ' + n + ', DT=   ' + m.dt + ' SEC');
    for (i = 0; i < n; i += 5) {
      lines.push([0, 1, 2, 3, 4].map(function (k) { return i + k < n ? (m.acc[i + k] / G).toExponential(5) : ''; })
        .filter(function (x) { return x; }).join('  '));
    }
    $('mo-text').value = lines.join('\n');
    $('mo-unit').value = 'g'; $('mo-dt').value = m.dt;
    $('mo-parse').textContent = '已把当前记录导出成 PEER AT2 风格的文本，点「载入」即可原样读回来（可用来验证解析器）。';
  }
  function doShare() {
    var url = location.origin + location.pathname + '#s=' + A.shareCode();
    var msg = $('ck-share-msg');
    try { location.hash = 's=' + A.shareCode(); } catch (e) { /* 忽略 */ }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { msg.textContent = '已复制到剪贴板。'; },
        function () { msg.textContent = '链接已写进地址栏，手动复制即可。'; });
    } else msg.textContent = '链接已写进地址栏，手动复制即可。';
  }

  function init() {
    A.load();
    buildShell();
    fillSelects();
    A.syncLists();
    syncInputs();
    bind();
    show(S.tab);
    $('sq-foot-note').textContent = '内置 ' + SQ_RECORDS.length + ' 条公开档案强震记录；引擎逐点对拍 OpenSees、scipy 与 eqsig，'
      + '离线断言 ' + VERIFY.asserts + ' 条 0 失败。纯前端、零上传，所有设置存在本机浏览器里。';
    $('sq-top-tag').textContent = 'OpenSees 逐点对拍 ' + VERIFY.opsRel.toExponential(1);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})(SQAPP);

</script>
</body>
</html>
