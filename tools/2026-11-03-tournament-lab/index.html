<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>赛事编排工作台 · Tournament Lab</title>
<meta name="description" content="循环赛 / 瑞士制 / 淘汰赛编排：FIDE 贝格尔表、最大权匹配瑞士制配对、标准种子位对阵图、FIDE 2026 破同分（含未赛轮管理）、UEFA 相互战绩、FIDE 等级分与 Glicko-2。纯前端，数据只存本机。" />
<style>
[hidden]{display:none!important}
:root{
  --canvas:#131313; --slate:#2d2d2d; --frame:#313131; --mint:#3cffd0; --mint-dim:#309875;
  --violet:#5200ff; --violet-rule:#3d00bf; --white:#ffffff; --muted:#e9e9e9; --meta:#949494;
  --link-hover:#3860be; --focus:#1eaedb; --yellow:#ffe14d; --pink:#ff8fd0; --orange:#ff7a3d; --pressed:#8c8c8c;
  --display:Impact,"Haettenschweiler","Arial Narrow Bold","Anton",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--white);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--white);text-decoration:none}
a:hover{color:var(--link-hover)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tl-wrap{max-width:1280px;margin:0 auto;padding:0 48px 64px}
.tl-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 10px;border-bottom:1px solid var(--frame)}
.tl-back{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:1.5px;color:var(--white)}
.tl-top-tags{display:flex;gap:8px;flex-wrap:wrap}
.tl-tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:1.8px;padding:4px 10px;border-radius:20px;background:var(--violet);color:var(--white)}
.tl-tag.tl-tag-mint{background:var(--mint);color:#000}
.tl-hero{padding:34px 0 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.tl-kicker{font-weight:300;font-size:19px;letter-spacing:1.9px;color:var(--muted);margin:0 0 10px}
.tl-word{font-family:var(--display);font-weight:900;font-size:96px;line-height:.95;letter-spacing:1.07px;margin:0;color:var(--white)}
.tl-word span{color:var(--mint)}
.tl-deck{margin:14px 0 0;max-width:760px;color:var(--muted);font-size:16px;line-height:1.6}
.tl-kpis{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:12px;min-width:0}
.tl-kpi{border-radius:20px;padding:16px 18px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.tl-kpi b{display:block;font-size:30px;line-height:1;font-weight:700}
.tl-kpi i{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:1.5px}
.tl-kpi-mint{background:var(--mint);color:#000}
.tl-kpi-violet{background:var(--violet);color:#fff}
.tl-kpi-yellow{background:var(--yellow);color:#000}
.tl-kpi-line{border:1px solid var(--white);color:var(--white)}
.tl-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;border:1px solid var(--white);border-radius:24px;margin-bottom:18px}
.tl-bar label{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:1.5px;color:var(--meta)}
.tl-sp{flex:1}
select,input[type=text],input[type=number],textarea{background:var(--canvas);color:var(--white);border:1px solid var(--meta);border-radius:2px;font:15px var(--sans);padding:7px 9px;min-height:36px;transition:border-color .15s ease}
select:focus,input:focus,textarea:focus{border-color:var(--mint);outline:none}
select{min-width:104px}
textarea{width:100%;min-height:110px;resize:vertical;font-family:var(--mono);font-size:13px}
input[type=number]{width:110px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--mint);margin:0}
.tl-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:24px;padding:10px 22px;font:700 15px var(--sans);cursor:pointer;background:var(--mint);color:#000;min-height:40px;transition:background .18s ease,box-shadow .18s ease}
.tl-btn:hover{background:rgba(255,255,255,.2);box-shadow:0 0 0 1px #c2c2c2;color:#fff}
.tl-btn:active{background:rgba(140,140,140,.87)}
.tl-btn-slate{background:var(--slate);color:var(--muted);font-weight:400}
.tl-btn-line{background:transparent;color:var(--mint);border:1px solid var(--mint);border-radius:40px;font:600 12px var(--mono);letter-spacing:1.5px;padding:10px 18px}
.tl-btn-line:hover{background:var(--mint);color:#000;box-shadow:none}
.tl-btn-violet{background:transparent;color:#fff;border:1px solid var(--violet);border-radius:30px;font-weight:400}
.tl-btn-sm{padding:6px 14px;min-height:30px;font-size:13px}
.tl-btn[disabled]{opacity:.4;cursor:not-allowed}
.tl-tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--frame);margin-bottom:22px;position:relative}
.tl-tab{flex:0 0 auto;background:none;border:none;color:var(--meta);font:600 12px var(--mono);letter-spacing:1.5px;padding:12px 14px 11px;cursor:pointer;white-space:nowrap;min-width:64px}
.tl-tab:hover{color:var(--link-hover)}
.tl-tab[aria-selected=true]{color:var(--white);box-shadow:0 -2px 0 0 var(--mint) inset}
.tl-tab em{font-style:normal;font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:0;margin-right:6px;color:inherit}
.tl-pane h2{font-size:24px;font-weight:700;line-height:1;margin:0 0 6px}
.tl-pane h3{font-size:18px;font-weight:700;margin:22px 0 10px}
.tl-eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:1.8px;color:var(--mint);margin:0 0 8px}
.tl-sub{color:var(--meta);font-size:13px;margin:0 0 16px}
.tl-grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.tl-grid2>*{min-width:0}
.tl-card{border:1px solid var(--white);border-radius:20px;padding:22px 24px;min-width:0}
.tl-card-slate{background:var(--slate);border-color:var(--slate)}
.tl-card-violet{border-color:var(--violet)}
.tl-card-mint{border-color:var(--mint)}
.tl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tl-row+.tl-row{margin-top:10px}
.tl-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.tl-field>span{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:1.5px;color:var(--meta)}
.tl-scroll{overflow-x:auto;position:relative;max-width:100%}
table.tl-t{border-collapse:collapse;width:100%;font-size:14px}
.tl-t th{font:600 11px var(--mono);letter-spacing:1.1px;color:var(--meta);text-align:left;padding:8px 10px;border-bottom:1px solid var(--white);white-space:nowrap}
.tl-t td{padding:8px 10px;border-bottom:1px solid var(--frame);vertical-align:middle;white-space:nowrap}
.tl-t td.tl-num,.tl-t th.tl-num{text-align:right;font-variant-numeric:tabular-nums}
.tl-t tr.tl-me td{background:rgba(60,255,208,.08)}
.tl-t select{min-height:32px;padding:4px 6px;font-size:14px;min-width:104px}
.tl-t input[type=number]{width:104px;min-height:32px;padding:4px 6px}
.tl-t input[type=text]{width:100%;min-width:120px;min-height:32px;padding:4px 6px}
.tl-mono{font-family:var(--mono);font-size:12px;letter-spacing:.5px}
.tl-meta{color:var(--meta)}
.tl-pts{font-weight:700;font-size:16px}
.tl-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--white);border-radius:20px;padding:4px 6px 4px 12px;margin:0 6px 6px 0;font-size:13px}
.tl-chip button{background:var(--slate);color:var(--muted);border:none;border-radius:20px;height:28px;min-width:52px;padding:0 10px;cursor:pointer;font:600 11px var(--mono);letter-spacing:1px;line-height:1}
.tl-chip button:hover{background:var(--link-hover);color:#fff}
.tl-chip b{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--mint);font-weight:600}
.tl-stream{position:relative;padding-left:96px}
.tl-stream::before{content:"";position:absolute;left:78px;top:6px;bottom:6px;border-left:1px dashed var(--violet-rule)}
.tl-item{position:relative;margin-bottom:16px}
.tl-stamp{position:absolute;left:-96px;top:20px;width:70px;text-align:right;font:600 11px var(--mono);letter-spacing:1.1px;color:var(--meta)}
.tl-stamp b{display:block;font-size:22px;color:var(--white);font-family:var(--sans);letter-spacing:0}
.tl-item .tl-card{background:var(--canvas)}
.tl-item.tl-cur .tl-card{border-color:var(--mint)}
.tl-res-w{color:var(--mint)}
.tl-bye{color:var(--meta);font-size:13px}
.tl-flag{display:inline-block;font:600 10px var(--mono);letter-spacing:1px;border-radius:20px;padding:2px 8px;background:var(--slate);color:var(--muted);margin-left:6px}
.tl-flag.tl-flag-v{background:var(--violet);color:#fff}
.tl-flag.tl-flag-m{background:var(--mint);color:#000}
.tl-flag.tl-flag-y{background:var(--yellow);color:#000}
.tl-note{border-left:2px solid var(--violet);padding:6px 0 6px 14px;color:var(--muted);font-size:14px;margin:10px 0}
.tl-note.tl-warn{border-color:var(--yellow)}
.tl-log{margin:0;padding:0;list-style:none}
.tl-log li{padding:6px 0;border-bottom:1px solid var(--frame);font-size:14px;color:var(--muted)}
.tl-log li b{color:var(--white)}
.tl-trace li{padding:8px 0}
.tl-empty{color:var(--meta);padding:24px 0}
.tl-svgbox{overflow-x:auto;position:relative;border:1px solid var(--frame);border-radius:20px;padding:12px;background:var(--canvas)}
.tl-svgbox svg{display:block}
.tl-cross td.tl-c{text-align:center;min-width:34px;font-family:var(--mono)}
.tl-cross td.tl-self{background:var(--slate)}
.tl-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--mint);color:#000;font:600 12px var(--mono);letter-spacing:1.5px;padding:10px 20px;border-radius:24px;z-index:20}
.tl-about p{max-width:860px;color:var(--muted);line-height:1.7}
.tl-about code{font-family:var(--mono);font-size:13px;background:var(--slate);padding:1px 6px;border-radius:4px}
.tl-dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0}
.tl-dl dt{font:600 11px var(--mono);letter-spacing:1.1px;color:var(--meta);padding-top:3px}
.tl-dl dd{margin:0;color:var(--muted)}
.tl-pal{display:flex;flex-wrap:wrap;gap:8px}
.tl-kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--meta);border-radius:4px;padding:1px 6px;color:var(--muted)}
@media (max-width:1023px){ .tl-word{font-size:72px} .tl-grid2{grid-template-columns:minmax(0,1fr)} .tl-hero{grid-template-columns:minmax(0,1fr)} }
@media (max-width:767px){
  .tl-wrap{padding:0 20px 48px}
  .tl-word{font-size:52px}
  .tl-kicker{font-size:16px}
  .tl-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tl-kpi b{font-size:24px}
  .tl-stream{padding-left:0}
  .tl-stream::before{display:none}
  .tl-stamp{position:static;width:auto;text-align:left;margin-bottom:6px}
  .tl-stamp b{display:inline;font-size:16px;margin-right:8px}
  .tl-card{padding:18px 16px}
  .tl-bar{border-radius:20px}
}
@media print{ .tl-top,.tl-bar,.tl-tabs,.tl-hero,.tl-noprint{display:none!important} body{background:#fff;color:#000} .tl-card{border-color:#000} .tl-t th,.tl-t td{color:#000;border-color:#999} }
</style>
</head>
<body>
<div class="tl-wrap">
  <header class="tl-top">
    <a class="tl-back" href="../../">← 返回工具集</a>
    <div class="tl-top-tags"><span class="tl-tag tl-tag-mint">FIDE 2026</span><span class="tl-tag">OFFLINE · LOCALSTORAGE</span></div>
  </header>
  <section class="tl-hero">
    <div>
      <p class="tl-kicker">赛事编排工作台 · 循环赛 / 瑞士制 / 淘汰赛</p>
      <h1 class="tl-word">TOURNAMENT <span>LAB</span></h1>
      <p class="tl-deck">报名、编排、录比分、出名次、算等级分，一页做完。瑞士制用最大权匹配找「分差最小、颜色最顺、谁也不重复」的那一组对子；循环赛用 FIDE 官方贝格尔表；破同分照 FIDE 2026 年 3 月起施行的规则逐条实现。</p>

<div class="tl-toast" id="tl-toast" hidden role="status" aria-live="polite"></div>
<script id="tl-engine">
/* 赛事编排工作台 · 引擎（纯函数，无 DOM）
 * 1. 最大权匹配：逐行移植 networkx.max_weight_matching（Van Rantwijk 的 Edmonds 花算法，O(n³)，整数权全程整数运算）
 * 2. 贝格尔表：FIDE C.05 Annex 1 的生成规则（第 1 轮 1-N, 2-(N-1)…；之后非 N 号 +N/2 轮转、1 号台换色）
 * 3. 瑞士制：硬约束（不重复相遇 / 颜色差 ≤2 / 不连续三次同色 / 轮空资格）+ 字典序代价的最大权完美匹配
 * 4. 淘汰赛：标准种子位（1-16, 8-9, 5-12, 4-13 …）、首轮轮空给高种子、三四名决赛
 * 5. 破同分：FIDE C.07（2026-03-01 起施行版）—— DE / WIN / WON / BPG / BWG / PS / REP / BH 系列 / FB / AOB / SB / KS / ARO / TPR / PTP / APRO / TPN，
 *    含第 16 条未赛轮管理（调整分、虚拟对手、Cut-1 例外）；比分制另有 UEFA 式相互战绩递归、净胜分、总得分
 * 6. 等级分：FIDE 表 8.1.2（含 2025-10 起 2650 分以下 400 分封顶）、对数 Elo、Glicko-2（Glickman 2013，Illinois 迭代）
 */
var TL = (function () {
  'use strict';
  var abs = Math.abs, floor = Math.floor, sqrt = Math.sqrt, exp = Math.exp, log = Math.log, max = Math.max, min = Math.min, PI = Math.PI;

  /* ================= 0. 小工具 ================= */
  function at(a, i) { return a[i < 0 ? i + a.length : i]; }
  function roundHalfUp(x) { return floor(x + 0.5); }                       // FIDE 10.1「0.5 rounded up」
  function roundAway(x) { return x < 0 ? -floor(-x + 0.5) : floor(x + 0.5); } // FIDE 8.3.4「0.5 away from zero」
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, seed) {
    var a = arr.slice(), rnd = mulberry32(seed);
    for (var i = a.length - 1; i > 0; i--) { var j = floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  var collator = null;
  try { collator = new Intl.Collator('zh-CN'); } catch (e) { collator = null; }
  function cmpName(a, b) { a = a || ''; b = b || ''; return collator ? collator.compare(a, b) : (a < b ? -1 : a > b ? 1 : 0); }
  function fmtPts(x) {
    if (x === null || x === undefined || isNaN(x)) return '';
    var w = floor(x + 1e-9), f = x - w;
    if (abs(f - 0.5) < 1e-9) return (w === 0 ? '' : String(w)) + '½';
    if (abs(f) < 1e-9) return String(w);
    return String(Math.round(x * 100) / 100);
  }

  /* ================= 1. 最大权匹配（networkx 移植） ================= */
  function Blossom() { this.childs = []; this.edges = []; this.mybestedges = null; }
  function isB(x) { return x instanceof Blossom; }
  function leaves(b) {
    var out = [], stack = b.childs.slice();
    while (stack.length) {
      var t = stack.pop();
      if (isB(t)) { for (var i = 0; i < t.childs.length; i++) stack.push(t.childs[i]); }
      else out.push(t);
    }
    return out;
  }
  /** n 个顶点 0..n-1；edges = [[i, j, w], …]（整数权）；返回 Int32Array mate（-1 = 未匹配）。 */
  function maxWeightMatching(n, edgeList, maxcardinality) {
    var NONE = -1;
    var nbr = [], i, j, k;
    for (i = 0; i < n; i++) nbr.push([]);
    var W = new Map();
    var maxweight = 0, allinteger = true;
    for (k = 0; k < edgeList.length; k++) {
      var e = edgeList[k]; i = e[0]; j = e[1]; var w = e[2];
      if (i === j) continue;
      if (!W.has(i * n + j)) { nbr[i].push(j); nbr[j].push(i); }
      W.set(i * n + j, w); W.set(j * n + i, w);

      '<button class="tl-btn tl-btn-line" id="tl-next-ed" type="button">用新等级分开下一届</button>' +

      '<div class="tl-card"><div class="tl-scroll"><table class="tl-t" id="tl-ratings-table"><thead><tr><th>选手</th><th class="tl-num">原分</th><th class="tl-num">局数</th><th class="tl-num">得分</th><th class="tl-num">期望分 ΣPD</th><th class="tl-num">K</th><th class="tl-num">FIDE 变化</th><th class="tl-num">FIDE 新分</th><th class="tl-num">Glicko r′</th><th class="tl-num">RD′</th><th class="tl-num">σ′</th></tr></thead><tbody>' + body + '</tbody></table></div></div>' +
      '<h3>FIDE 等级分变化</h3><div class="tl-svgbox" id="tl-rating-fig">' + ratingBars(rows, pm) + '</div>';
  }
  function ratingBars(rows, pm) {
    var rs = rows.filter(function (r) { return r.R0 > 0 && r.games > 0; });
    if (!rs.length) return '<p class="tl-meta">没有评级选手的对局。</p>';
    var rowH = 26, labW = 150, W = 640, mid = labW + (W - labW - 60) / 2, maxAbs = 1;
    rs.forEach(function (r) { maxAbs = Math.max(maxAbs, Math.abs(r.fide.change)); });
    // 负值标签画在条的左端外侧：给它留足 48px，保证不会压到左侧姓名列（姓名列右边界 labW−10）
    var room = Math.min(mid - labW - 48, W - mid - 48), scale = room / maxAbs, H = rs.length * rowH + 30, parts = [];
    parts.push('<line x1="' + mid + '" y1="6" x2="' + mid + '" y2="' + (H - 18) + '" stroke="#949494" stroke-width="1"/>');
    rs.forEach(function (r, i) {
      var y = 10 + i * rowH, ch = r.fide.change, w = Math.abs(ch) * scale;
      parts.push('<text x="' + (labW - 10) + '" y="' + (y + 15) + '" text-anchor="end" font-size="12" fill="#e9e9e9" font-family="-apple-system,PingFang SC,sans-serif">' + esc(trunc(pm[r.id].name, 16)) + '</text>');
      parts.push('<rect x="' + (ch >= 0 ? mid : mid - w) + '" y="' + (y + 3) + '" width="' + Math.max(w, 1) + '" height="' + (rowH - 8) + '" rx="4" fill="' + (ch >= 0 ? '#3cffd0' : '#5200ff') + '"/>');
      parts.push('<text x="' + (ch >= 0 ? mid + w + 6 : mid - w - 6) + '" y="' + (y + 15) + '" text-anchor="' + (ch >= 0 ? 'start' : 'end') + '" font-size="11" fill="#ffffff" font-family="ui-monospace,Menlo,monospace">' + (ch > 0 ? '+' : '') + ch + '</text>');
    });
    return '<svg id="tl-rating-svg" xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="FIDE 等级分变化条形图">' + parts.join('') + '</svg>';
  }
  function nextEdition(T, src) {
    var rep = TL.ratingReport(T, { tau: +(T.tau || 0.5) }), by = {};
    rep.rows.forEach(function (r) { by[r.id] = r; });
    var N = newTournament(T.name.replace(/（第 \d+ 届）$/, '') + '（第 ' + ((T.edition || 1) + 1) + ' 届）', T.format, T.mode, T.nRounds);
    N.edition = (T.edition || 1) + 1; N.pts = clone(T.pts); N.tiebreaks = T.tiebreaks.slice(); N.useColors = T.useColors; N.double = T.double; N.tau = T.tau;
    T.players.forEach(function (p) {
      var r = by[p.id], np = { id: p.id, name: p.name, rating: p.rating, k: p.k };
      if (src === 'glicko') { np.rating = Math.round(r.glicko.r); np.rd = Math.round(r.glicko.rd * 10) / 10; np.vol = Math.round(r.glicko.vol * 1e6) / 1e6; }
      else { np.rating = p.rating > 0 ? p.rating + r.fide.change : p.rating; np.rd = p.rd; np.vol = p.vol; }
      N.players.push(np);
    });
    N.nextId = T.nextId || T.players.length + 1;
    state.list.push(N); state.cur = N.id; state.tab = 'players'; commit(N);
    toast('已新建「' + N.name + '」，选手等级分已更新');
  }

  /* ---------- 设置 ---------- */
  function renderSettings(T) {
    var pane = $('#pane-settings'), P = TL.ptsOf(T);
    var ptsRow = [['win', '胜'], ['draw', '和'], ['loss', '负'], ['pab', '编排轮空'], ['hpb', '请假（半分）'], ['zpb', '请假（零分）']].map(function (x) {
      return '<label class="tl-field"><span>' + x[1] + '</span><input type="number" data-pt="' + x[0] + '" value="' + P[x[0]] + '" step="0.5" min="0" max="10" /></label>';
    }).join('');
    pane.innerHTML = '<p class="tl-eyebrow">SETTINGS</p><h2>赛事设置</h2><p class="tl-sub">赛制在新建时选定；积分规则、颜色、轮数随时可改，积分榜即时重算。</p>' +
      '<div class="tl-grid2"><div class="tl-card"><div class="tl-row"><label class="tl-field"><span>名称</span><input type="text" id="tl-set-name" value="' + esc(T.name) + '" /></label>' +
      '<label class="tl-field"><span>赛制</span><select id="tl-set-format" disabled><option>' + FORMAT_ZH[T.format] + '</option></select></label>' +
      '<label class="tl-field"><span>计分</span><select id="tl-set-mode" ' + (started(T) ? 'disabled' : '') + '><option value="chess"' + (T.mode === 'chess' ? ' selected' : '') + '>胜负和（棋类）</option><option value="score"' + (T.mode === 'score' ? ' selected' : '') + '>比分（球类）</option></select></label>' +
      (T.format === 'swiss' ? '<label class="tl-field"><span>计划轮数</span><input type="number" id="tl-set-rounds" value="' + T.nRounds + '" min="' + Math.max(1, T.rounds.length) + '" max="30" /></label>' : '') + '</div>' +
      '<h3>积分</h3><div class="tl-row">' + ptsRow + '</div>' +
      (T.format === 'swiss' && T.mode === 'chess' ? '<h3>颜色</h3><div class="tl-row"><label class="tl-field" style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="tl-set-colors" ' + (T.useColors !== false ? 'checked' : '') + ' /><span>编排时考虑先后手（颜色）</span></label>' +
        '<label class="tl-field"><span>首轮 1 号执</span><select id="tl-set-initial"><option value="W"' + (T.initialColor !== 'B' ? ' selected' : '') + '>白（先手）</option><option value="B"' + (T.initialColor === 'B' ? ' selected' : '') + '>黑（后手）</option></select></label></div>' : '') +
      '</div><div class="tl-card tl-card-violet"><p class="tl-eyebrow">DANGER ZONE</p><p class="tl-sub">清空全部对阵与结果（选手保留）。按钮要连点两次。</p>' +
      '<button class="tl-btn tl-btn-violet" id="tl-reset" type="button">' + (state.armed === 'reset' ? '再点一次确认清空' : '清空赛程') + '</button></div></div>';
  }

  /* ---------- 说明 ---------- */
  function renderAbout() {
    $('#pane-about').innerHTML = '<p class="tl-eyebrow">ABOUT · METHOD</p><h2>它是怎么算的</h2>' +
      '<p>这一页把一场比赛从报名到发奖要做的计算都放在浏览器里：不联网、不上传，数据只存在本机 localStorage，可导出 JSON 备份或换电脑继续。</p>' +
      '<div class="tl-grid2"><div class="tl-card"><dl class="tl-dl">' +
      '<dt>循环赛</dt><dd>FIDE C.05 Annex 1 贝格尔表：第 1 轮 1–N、2–(N−1)…；之后非 N 号整体 +N/2 轮转，第 1 台换色。3–16 人的官方表与本页逐台一致（含颜色）。</dd>' +
      '<dt>瑞士制</dt><dd>先按（积分低 → 编号大）找第一个「没轮空过、去掉他以后其余人仍能合法两两配对」的人轮空；再把配对变成一般图上的最大权完美匹配（Edmonds 花算法，移植自 networkx，整数权全程整数运算）。代价按字典序：重复相遇 → 违反绝对颜色 → 分差平方和 → 颜色偏好落空 → 连续同向漂移 → 同分组内上半区对下半区。这不是 FIDE 荷兰制的逐条复刻，但每一轮都给出「为什么这么配」。实在配不出来时的退让顺序：先放宽颜色（C.04.1 第 6、7 条允许例外），再让人二次轮空，最后才允许重复相遇。</dd>' +
      '<dt>颜色</dt><dd>FIDE C.04.3：颜色差 ≥2 或连续两局同色 = 绝对偏好；差 ±1 = 强偏好；差 0 = 温和偏好（换色）。分配按 E.1–E.5。未实赛的轮次不计入颜色历史（C.04.2 3.4）。</dd>' +
      '<dt>淘汰赛</dt><dd>标准种子位（1–16、8–9、5–12、4–13 …），首轮空位给高种子；可设三四名决赛。</dd>' +
      '<dt>破同分</dt><dd>FIDE C.07（2026-03-01 起施行）：直胜（第 6 条，含瑞士制「不论缺赛结果都领先」规则）、胜轮数、对手分系列与 Cut / Median、索伯分、累进分、科亚分、对手均分、表现分、完美表现分等；瑞士制按第 16 条处理未赛轮（调整分、虚拟对手及其上限、Cut-1 例外）。比分制另有 UEFA 式相互战绩（小组内积分 → 净胜 → 进球，仍并列的子组单独重算）。</dd>' +
      '<dt>等级分</dt><dd>FIDE B.02：表 8.1.1 / 8.1.2 查表；Glicko-2 按 Glickman 2013 文档（Illinois 迭代求 σ′，ε = 0.000001）。</dd>' +
      '</dl></div><div class="tl-card tl-card-slate"><p class="tl-eyebrow">VERIFIED AGAINST</p><ul class="tl-log" id="tl-verify">' + (window.TL_VERIFY || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
      '<p class="tl-eyebrow" style="margin-top:18px">KEYBOARD</p><p class="tl-meta" style="margin:0">页签上用 <span class="tl-kbd">←</span> <span class="tl-kbd">→</span> 切换；表格里的下拉和输入框都能用 <span class="tl-kbd">Tab</span> 逐台录入。</p></div></div>';
  }

  /* ---------- 事件 ---------- */
  function onTab(t) { state.tab = t; save(); render(); }
  function bind() {
    $('#tl-tabs').addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (b) onTab(b.getAttribute('data-tab')); });
    $('#tl-tabs').addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var i = TABS.indexOf(state.tab); i = (i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
      onTab(TABS[i]); $('#tab-' + TABS[i]).focus(); e.preventDefault();
    });
    $('#tl-pick').addEventListener('change', function () { state.cur = this.value; save(); render(); });
    $('#tl-new-open').addEventListener('click', function () { $('#tl-new').hidden = false; $('#tl-new-name').focus(); });
    $('#tl-new-cancel').addEventListener('click', function () { $('#tl-new').hidden = true; });
    $('#tl-new-go').addEventListener('click', function () {
      var T = newTournament($('#tl-new-name').value.trim() || '新赛事', $('#tl-new-format').value, $('#tl-new-mode').value, $('#tl-new-rounds').value);
      state.list.push(T); state.cur = T.id; state.tab = 'players'; $('#tl-new').hidden = true; commit(T); toast('已创建「' + T.name + '」');
    });
    $('#tl-dup').addEventListener('click', function () { var T = clone(cur()); T.id = uid('t'); T.name = T.name + ' 副本'; state.list.push(T); state.cur = T.id; commit(T); toast('已复制'); });
    $('#tl-del').addEventListener('click', function () {
      if (state.armed !== 'del') { state.armed = 'del'; this.textContent = '再点确认删除'; var b = this; setTimeout(function () { if (state.armed === 'del') { state.armed = null; b.textContent = '删除'; } }, 3000); return; }
      state.armed = null; this.textContent = '删除';
      state.list = state.list.filter(function (T) { return T.id !== state.cur; });
      if (!state.list.length) state.list.push(clone(TL_DEMOS[0].t));
      state.cur = state.list[0].id; save(); render(); toast('已删除');
    });
    $('#tl-demo').addEventListener('change', function () {
      if (this.value === '') return;
      var d = TL_DEMOS[+this.value], T = clone(d.t); T.id = uid('t');
      state.list.push(T); state.cur = T.id; state.tab = d.tab || 'standings'; this.value = ''; commit(T); toast('已载入示例「' + T.name + '」');
    });
    $('#tl-export').addEventListener('click', function () { download((cur().name || 'tournament') + '.json', JSON.stringify(cur(), null, 1), 'application/json'); });
    $('#tl-import').addEventListener('change', function () {
      var f = this.files && this.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var T = JSON.parse(rd.result);
          if (!T || !Array.isArray(T.players) || !Array.isArray(T.rounds) || ['swiss', 'rr', 'ko'].indexOf(T.format) < 0) throw new Error('不是本页导出的赛事文件');
          T.id = uid('t'); T.withdrawn = T.withdrawn || {}; T.requests = T.requests || {}; T.ko = T.ko || { third: true, res: {} }; T.tiebreaks = T.tiebreaks || [];
          state.list.push(T); state.cur = T.id; commit(T); toast('已导入「' + T.name + '」');
        } catch (e) { toast('导入失败：' + e.message); }
      };
      rd.readAsText(f); this.value = '';
    });
    var panes = $('#tl-panes');
    panes.addEventListener('click', onClick);
    panes.addEventListener('change', onChange);
    panes.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'tl-add-name' || e.key === 'Enter' && e.target.id === 'tl-add-rating') { e.preventDefault(); $('#tl-add-go').click(); } });
  }
  function download(name, text, type) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type }));
    a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function onClick(e) {
    var T = cur(), t = e.target, id = t.id, row = t.closest('tr'), act = t.getAttribute('data-act');
    if (id === 'tl-add-go') {
      var nid = addPlayer(T, $('#tl-add-name').value, $('#tl-add-rating').value);
      if (!nid) { toast('请输入姓名'); return; }
      commit(T); $('#tl-add-name').focus(); toast('已添加'); return;
    }
    if (id === 'tl-bulk-go') { var list = parseBulk($('#tl-bulk').value); list.forEach(function (x) { addPlayer(T, x.name, x.rating); }); commit(T); toast('已添加 ' + list.length + ' 人'); return; }
    if (id === 'tl-draw') { var seed = Math.floor(Math.random() * 1e9); T.drawSeed = seed; T.seedOrder = TL.shuffle(T.players.map(function (p) { return p.id; }), seed); commit(T); toast('抽签完成'); return; }
    if (id === 'tl-undraw') { T.seedOrder = null; T.drawSeed = null; commit(T); return; }
    if (id === 'tl-pair') { pairNext(T); return; }
    if (id === 'tl-unpair') { var last = T.rounds.length; T.rounds.pop(); Object.keys(T.withdrawn || {}).forEach(function (k) { if (+T.withdrawn[k] >= last) delete T.withdrawn[k]; }); commit(T); toast('已撤销第 ' + last + ' 轮'); return; }
    if (id === 'tl-rr-gen') { genRR(T); return; }
    if (id === 'tl-csv') { download(T.name + '-积分榜.csv', csvStandings(T), 'text/csv'); return; }
    if (id === 'tl-print') { window.print(); return; }
    if (id === 'tl-next-ed') { nextEdition(T, $('#tl-next-src').value); return; }
    if (id === 'tl-reset') {
      if (state.armed !== 'reset') { state.armed = 'reset'; render(); setTimeout(function () { if (state.armed === 'reset') { state.armed = null; if (state.tab === 'settings') render(); } }, 3000); return; }
      state.armed = null; T.rounds = []; T.withdrawn = {}; T.requests = {}; T.ko = { third: T.ko ? T.ko.third : true, res: {} }; commit(T); toast('赛程已清空'); return;
    }
    if (act === 'rm' && row) { var pid = row.getAttribute('data-id'); T.players = T.players.filter(function (p) { return p.id !== pid; }); if (T.seedOrder) T.seedOrder = T.seedOrder.filter(function (x) { return x !== pid; }); commit(T); return; }
    if (act === 'wd' && row) { T.withdrawn = T.withdrawn || {}; T.withdrawn[row.getAttribute('data-id')] = T.rounds.length; commit(T); toast('已登记退赛：之后不再编排'); return; }
    if (act === 'unwd' && row) { delete T.withdrawn[row.getAttribute('data-id')]; commit(T); return; }
    if (act === 'tb-up' || act === 'tb-rm') {
      var code = t.closest('.tl-chip').getAttribute('data-code'), i = T.tiebreaks.indexOf(code);
      if (act === 'tb-rm') T.tiebreaks.splice(i, 1);
      else if (i > 0) { T.tiebreaks.splice(i, 1); T.tiebreaks.splice(i - 1, 0, code); }
      commit(T); return;
    }
    if (act === 'tb-preset') { T.tiebreaks = PRESETS[t.getAttribute('data-p')].list.slice(); commit(T); return; }
  }
  function onChange(e) {
    var T = cur(), t = e.target, id = t.id, row = t.closest('tr'), f = t.getAttribute('data-f');
    if (row && row.hasAttribute('data-g') && f) {
      var g = T.rounds[+row.getAttribute('data-r')].pairs[+row.getAttribute('data-g')];
      if (f === 'res') g.res = t.value || null;
      else if (f === 'ff') { g.res = t.value || null; }
      else { var v = t.value === '' ? null : Math.max(0, Math.round(+t.value)); g[f] = v; if (!g.res || ['W', 'B', 'D'].indexOf(g.res) >= 0) g.res = null; }
      commit(T); return;
    }
    if (row && row.hasAttribute('data-key') && f) {
      T.ko = T.ko || { third: true, res: {} }; T.ko.res = T.ko.res || {};
      var key = row.getAttribute('data-key'), x = T.ko.res[key] || {};
      if (f === 'kores') { var v2 = t.value; if (!v2) delete T.ko.res[key]; else { x = { res: v2[0] === 'D' ? 'D' : v2, tbw: v2[0] === 'D' ? v2[1] : null }; T.ko.res[key] = x; } }
      else { x[f] = f === 'tbw' ? (t.value || null) : (t.value === '' ? null : Math.max(0, Math.round(+t.value))); T.ko.res[key] = x; }
      pruneKO(T); commit(T); return;
    }
    if (row && row.hasAttribute('data-id') && f) {
      var p = pmap(T)[row.getAttribute('data-id')];
      if (f === 'name') p.name = t.value.trim().slice(0, 40) || p.name;
      else if (f === 'rating') p.rating = Math.max(0, Math.round(+t.value || 0));
      else if (f === 'rd') p.rd = t.value === '' ? null : Math.min(350, Math.max(1, +t.value));
      else if (f === 'k') p.k = t.value ? +t.value : null;
      commit(T); return;
    }
    if (t.getAttribute('data-act') === 'req' && row) {
      var nr = T.rounds.length + 1; T.requests = T.requests || {}; T.requests[nr] = T.requests[nr] || {};
      if (t.value) T.requests[nr][row.getAttribute('data-id')] = t.value; else delete T.requests[nr][row.getAttribute('data-id')];
      commit(T); return;
    }
    if (id === 'tl-tb-add' && t.value) { T.tiebreaks.push(t.value); commit(T); return; }
    if (id === 'tl-rr-double') { T.double = t.checked; commit(T); return; }
    if (id === 'tl-ko-third') { T.ko = T.ko || { res: {} }; T.ko.third = t.checked; commit(T); return; }
    if (id === 'tl-tau') { var tv = +t.value; if (tv >= 0.2 && tv <= 1.2) { T.tau = tv; commit(T); } return; }
    if (id === 'tl-set-name') { T.name = t.value.trim() || T.name; commit(T); return; }
    if (id === 'tl-set-mode') { T.mode = t.value; T.pts = clone(TL.DEFAULT_PTS[T.mode]); T.useColors = T.mode !== 'score'; T.tiebreaks = defaultTB(T.format, T.mode); commit(T); return; }
    if (id === 'tl-set-rounds') { var n = Math.round(+t.value); if (n >= Math.max(1, T.rounds.length) && n <= 30) { T.nRounds = n; commit(T); } else render(); return; }
    if (id === 'tl-set-colors') { T.useColors = t.checked; commit(T); return; }
    if (id === 'tl-set-initial') { T.initialColor = t.value; commit(T); return; }
    if (t.hasAttribute('data-pt')) { var k = t.getAttribute('data-pt'), val = +t.value; if (!isNaN(val) && val >= 0) { T.pts = T.pts || {}; T.pts[k] = val; commit(T); } return; }
  }
  // 改了前面某场的胜负，后面依赖它的结果要作废（选手变了）
  function pruneKO(T) {
    var B = TL.koBracket(T), keep = {};
    B.rounds.forEach(function (ms) { ms.forEach(function (m) { if (m.a && m.b && T.ko.res[m.key]) keep[m.key] = 1; }); });
    if (B.third && B.third.a && B.third.b && T.ko.res['T-0']) keep['T-0'] = 1;
    Object.keys(T.ko.res).forEach(function (k) { if (!keep[k]) delete T.ko.res[k]; });
  }

  load(); bind(); render();
  window.TLApp = { state: state, cur: cur, render: render, pairNext: function () { pairNext(cur()); }, save: save };
})();

</script>
