<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机械臂工作台 · Robot Lab</title>
<style>
[hidden]{display:none!important}
:root{
  --rl-canvas:#f9f7f3; --rl-bone:#f3f0e8; --rl-card:#fff; --rl-dark:#202020; --rl-deep:#000;
  --rl-orange:#ea2804; --rl-orange-deep:#c01f00; --rl-glow:#ff6a3d; --rl-pink:#f4a8a0;
  --rl-ink:#202020; --rl-body:#3a3a3a; --rl-charcoal:#575757; --rl-mute:#646464; --rl-ash:#8d8d8d; --rl-stone:#bbb;
  --rl-ondark:#fcfcfc; --rl-ondark-mute:rgba(252,252,252,.72); --rl-divider-dark:rgba(255,255,255,.2);
  --rl-hair:rgba(32,32,32,.12); --rl-hair-strong:#202020; --rl-green:#2b9a66; --rl-focus:rgba(59,130,246,.5);
  --rl-disp:ui-sans-serif,-apple-system,"Helvetica Neue","Arial",sans-serif;
  --rl-sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --rl-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--rl-canvas);color:var(--rl-ink);font:400 16px/1.5 var(--rl-sans);-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:var(--rl-orange);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--rl-focus);outline-offset:2px}

/* ---------- 外壳 ---------- */
.rl-back{display:block;max-width:1280px;margin:0 auto;padding:14px 24px 0;font:600 14px/1 var(--rl-sans);color:var(--rl-charcoal)}
.rl-back:hover{color:var(--rl-orange);text-decoration:none}
.rl-nav{border-bottom:1px solid var(--rl-hair);background:var(--rl-canvas);position:sticky;top:0;z-index:20}
.rl-nav-in{max-width:1280px;margin:0 auto;min-height:60px;padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.rl-word{font:800 20px/1 var(--rl-disp);letter-spacing:-.6px;display:flex;align-items:center;gap:8px}
.rl-word i{width:12px;height:12px;border-radius:9999px;background:var(--rl-orange);display:inline-block}
.rl-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.rl-tab{appearance:none;border:1px solid var(--rl-hair);background:var(--rl-card);color:var(--rl-ink);
  font:600 14px/1 var(--rl-sans);padding:10px 16px;border-radius:9999px;cursor:pointer;min-height:38px}
.rl-tab:hover{border-color:var(--rl-hair-strong)}
.rl-tab[aria-selected="true"]{background:var(--rl-dark);color:var(--rl-ondark);border-color:var(--rl-dark)}
.rl-hero{max-width:1280px;margin:0 auto;padding:44px 24px 28px}
.rl-h1{font:800 clamp(38px,7vw,72px)/1 var(--rl-disp);letter-spacing:-1.8px;margin:0 0 16px}
.rl-lede{font:400 18px/1.56 var(--rl-sans);color:var(--rl-body);max-width:64ch;margin:0}
.rl-stamp{display:inline-flex;align-items:center;gap:8px;background:var(--rl-orange);color:#fff;
  font:600 14px/1 var(--rl-sans);padding:9px 16px;border-radius:9999px;margin-bottom:20px}
.rl-wrap{max-width:1280px;margin:0 auto;padding:0 24px 72px}
.rl-foot{background:var(--rl-deep);color:var(--rl-ondark);padding:48px 24px}
.rl-foot-in{max-width:1280px;margin:0 auto;display:flex;gap:24px;flex-wrap:wrap;justify-content:space-between;
  font:400 14px/1.6 var(--rl-sans)}
.rl-foot a{color:var(--rl-ondark)}
.rl-foot-mute{color:var(--rl-ondark-mute)}

/* ---------- 卡片 / 排版 ---------- */
.rl-card{background:var(--rl-card);border:1px solid var(--rl-hair);border-radius:10px;padding:20px;min-width:0}
.rl-card.rl-bone{background:var(--rl-bone);border-color:transparent}
.rl-h2{font:700 30px/1.2 var(--rl-disp);letter-spacing:-.5px;margin:36px 0 14px}
.rl-h3{font:600 20px/1.4 var(--rl-sans);letter-spacing:-.3px;margin:0 0 12px}
.rl-h4{font:600 14px/1.43 var(--rl-sans);letter-spacing:-.35px;margin:20px 0 8px;color:var(--rl-charcoal)}
.rl-h4:first-child{margin-top:0}
.rl-p{font:400 16px/1.5 var(--rl-sans);color:var(--rl-body);margin:0 0 12px}
.rl-small{font:400 14px/1.43 var(--rl-sans);color:var(--rl-charcoal)}
.rl-cap{font:400 12px/1.33 var(--rl-sans);color:var(--rl-mute)}
.rl-grid{display:grid;gap:16px}
.rl-g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.rl-g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.rl-g2c{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.rl-g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,138px),1fr))}
.rl-split{display:grid;gap:20px;grid-template-columns:minmax(0,360px) minmax(0,1fr);align-items:start}
@media (max-width:980px){.rl-split{grid-template-columns:minmax(0,1fr)}}
.rl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- 控件 ---------- */
.rl-btn{appearance:none;border:1px solid var(--rl-hair-strong);background:var(--rl-card);color:var(--rl-ink);
  font:600 15px/1 var(--rl-sans);padding:13px 22px;border-radius:9999px;cursor:pointer;min-height:44px;min-width:64px}
.rl-btn:hover{background:var(--rl-bone)}
.rl-btn-primary{background:var(--rl-orange);border-color:var(--rl-orange);color:#fff}
.rl-btn-primary:hover{background:var(--rl-orange-deep);border-color:var(--rl-orange-deep)}
.rl-btn-dark{background:var(--rl-dark);border-color:var(--rl-dark);color:var(--rl-ondark)}
.rl-btn-dark:hover{background:#000}
.rl-btn-sm{font:600 13px/1 var(--rl-sans);padding:9px 14px;min-height:36px;min-width:56px}
.rl-fld{display:block;margin:0 0 12px;min-width:0}
.rl-fld > span{display:block;font:600 13px/1.4 var(--rl-sans);color:var(--rl-charcoal);margin-bottom:6px}
.rl-in,.rl-sel{width:100%;min-width:104px;min-height:44px;background:var(--rl-card);color:var(--rl-ink);
  border:1px solid var(--rl-hair);border-radius:9999px;padding:11px 18px;font:400 15px/1.2 var(--rl-sans)}
.rl-in:focus,.rl-sel:focus{border-color:var(--rl-hair-strong)}
.rl-sel{appearance:none;background-image:linear-gradient(45deg,transparent 49%,var(--rl-ink) 50%),linear-gradient(-45deg,transparent 49%,var(--rl-ink) 50%);
  background-size:6px 6px;background-position:calc(100% - 20px) 20px,calc(100% - 14px) 20px;background-repeat:no-repeat;padding-right:40px}
.rl-ta{width:100%;min-height:210px;background:var(--rl-dark);color:var(--rl-ondark);border:1px solid var(--rl-dark);
  border-radius:10px;padding:16px;font:400 13px/1.55 var(--rl-mono);resize:vertical;white-space:pre}
.rl-chk{display:inline-flex;align-items:center;gap:8px;font:400 14px/1.4 var(--rl-sans);color:var(--rl-body);cursor:pointer}
.rl-chk input{width:20px;height:20px;min-width:20px;accent-color:var(--rl-orange)}
.rl-rng{width:100%;min-width:120px;height:26px;accent-color:var(--rl-orange)}
.rl-jrow{display:grid;grid-template-columns:32px minmax(0,1fr) 108px;gap:10px;align-items:center;margin-bottom:9px}
.rl-jname{font:600 13px/1 var(--rl-mono);color:var(--rl-charcoal)}
.rl-jnum{min-width:104px;width:100%;min-height:36px;border:1px solid var(--rl-hair);border-radius:9999px;
  padding:7px 10px;font:400 13px/1 var(--rl-mono);text-align:right;background:var(--rl-card);color:var(--rl-ink)}

/* ---------- 代码井 / 读数 ---------- */
.rl-well{background:var(--rl-dark);color:var(--rl-ondark);border-radius:10px;padding:18px;
  font:400 13px/1.5 var(--rl-mono);overflow-x:auto;white-space:pre}
.rl-well-deep{background:var(--rl-deep)}
.rl-welltabs{display:flex;gap:6px;background:var(--rl-deep);border-radius:10px 10px 0 0;padding:8px 8px 0}
.rl-wt{appearance:none;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--rl-ondark-mute);
  font:400 11px/1.5 var(--rl-mono);padding:6px 12px;border-radius:4px 4px 0 0;cursor:pointer;min-height:30px;min-width:56px}
.rl-wt[aria-selected="true"]{color:var(--rl-ondark);border-bottom-color:var(--rl-orange)}
.rl-welltabs + .rl-well{border-radius:0 0 10px 10px}
.rl-read{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,132px),1fr));gap:0;
  border:1px solid var(--rl-hair);border-radius:10px;overflow:hidden;background:var(--rl-card)}
.rl-rcell{padding:12px 14px;border-right:1px solid var(--rl-hair);border-bottom:1px solid var(--rl-hair);min-width:0}
.rl-rk{font:400 12px/1.33 var(--rl-sans);color:var(--rl-mute);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-rv{font:400 17px/1.2 var(--rl-mono);color:var(--rl-ink);overflow-wrap:anywhere}
.rl-rv b{font-weight:600}
.rl-badge{display:inline-block;background:var(--rl-green);color:#fff;font:400 12px/1.33 var(--rl-sans);
  padding:4px 10px;border-radius:9999px}
.rl-badge-bad{background:var(--rl-orange)}
.rl-badge-mute{background:var(--rl-bone);color:var(--rl-charcoal);border:1px solid var(--rl-hair)}
.rl-tag{display:inline-block;background:var(--rl-canvas);border:1px solid var(--rl-hair);color:var(--rl-ink);
  font:400 12px/1.33 var(--rl-sans);padding:4px 10px;border-radius:9999px}
.rl-note{border-left:3px solid var(--rl-orange);background:var(--rl-bone);border-radius:0 6px 6px 0;
  padding:12px 14px;font:400 14px/1.5 var(--rl-sans);color:var(--rl-body);margin:0 0 14px}

/* ---------- 表格 ---------- */
.rl-tw{overflow-x:auto;border:1px solid var(--rl-hair);border-radius:10px;background:var(--rl-card);min-width:0}
.rl-t{border-collapse:collapse;width:100%;font:400 13px/1.4 var(--rl-mono)}
.rl-t th{background:var(--rl-bone);text-align:left;padding:10px 12px;font:600 12px/1.3 var(--rl-sans);
  color:var(--rl-charcoal);border-bottom:1px solid var(--rl-hair);white-space:nowrap}
.rl-t td{padding:9px 12px;border-bottom:1px solid var(--rl-hair);white-space:nowrap}
.rl-t tbody tr:last-child td{border-bottom:0}
.rl-t tbody tr.rl-pick{cursor:pointer}
.rl-t tbody tr.rl-pick:hover{background:var(--rl-bone)}
.rl-t tr[data-sel="1"]{background:#fdf0ec}
.rl-t td.rl-num{text-align:right}
.rl-warnrow{color:var(--rl-orange-deep)}

/* ---------- 图 ---------- */
.rl-fig{background:var(--rl-card);border:1px solid var(--rl-hair);border-radius:10px;padding:12px;min-width:0}
.rl-fig svg{display:block;width:100%;height:auto}
.rl-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font:400 12px/1.33 var(--rl-sans);color:var(--rl-charcoal)}
.rl-legend span{display:inline-flex;align-items:center;gap:6px}
.rl-swatch{width:14px;height:8px;border-radius:2px;display:inline-block}
.rl-viewctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-top:10px}

.rl-caps{font:400 13px/1.5 var(--rl-mono)}
.rl-err{border-left:3px solid var(--rl-orange);background:#fdf0ec;padding:10px 14px;border-radius:0 6px 6px 0;
  font:400 13px/1.5 var(--rl-mono);color:var(--rl-orange-deep);margin:10px 0 0}
</style>
</head>

    var pts3 = frames.map(function (T) { return RB.transOf(T); });
    var reach = Math.max(RB.reachBound(model) * 0.62, 0.15);
    var floor = [], i, j, gn = 5, gs = reach * 0.8 / gn;
    for (i = -gn; i <= gn; i++) {
      floor.push([[i * gs, -gn * gs, 0], [i * gs, gn * gs, 0]]);
      floor.push([[-gn * gs, i * gs, 0], [gn * gs, i * gs, 0]]);
    }
    // 只按臂本体 + 世界三轴 + 目标点定比例：地面网格不参与（否则臂在画面里会缩得很小，
    // 2026-09-15 人工看图发现）。网格超出 viewBox 的部分由 SVG 自然裁掉。
    var all = pts3.slice();
    all.push([reach * 0.45, 0, 0], [0, reach * 0.45, 0], [0, 0, reach * 0.45], [0, 0, 0]);
    if (opt.targetT) all.push(RB.transOf(opt.targetT));
    if (opt.trail) opt.trail.forEach(function (p) { all.push(p); });
    if (opt.extraPts) opt.extraPts.forEach(function (p) { all.push(p); });
    var p2 = all.map(proj);
    var xlo = Math.min.apply(null, p2.map(function (p) { return p[0]; }));
    var xhi = Math.max.apply(null, p2.map(function (p) { return p[0]; }));
    var ylo = Math.min.apply(null, p2.map(function (p) { return p[1]; }));
    var yhi = Math.max.apply(null, p2.map(function (p) { return p[1]; }));
    var pad = 34, sx = (W - 2 * pad) / Math.max(xhi - xlo, 1e-6), sy = (H - 2 * pad) / Math.max(yhi - ylo, 1e-6);
    var s = Math.min(sx, sy);
    var cx = (xlo + xhi) / 2, cy = (ylo + yhi) / 2;
    var SC = function (p3) {
      var p = proj(p3);
      return [W / 2 + (p[0] - cx) * s, H / 2 - (p[1] - cy) * s];
    };
    var P = new Placer(W, H, 1.5), g = [];
    g.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#f9f7f3"/>');
    floor.forEach(function (sg) {
      var a = SC(sg[0]), b = SC(sg[1]);
      g.push('<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '" stroke="rgba(32,32,32,.09)" stroke-width="1"/>');
    });
    // 世界坐标系三轴
    var axL = reach * 0.42, o = SC([0, 0, 0]);

    axes.forEach(function (ax) {
      var e2 = SC(ax[0]);
      g.push('<line x1="' + o[0].toFixed(1) + '" y1="' + o[1].toFixed(1) + '" x2="' + e2[0].toFixed(1) + '" y2="' + e2[1].toFixed(1) + '" stroke="' + ax[1] + '" stroke-width="1.4"/>');
      P.reserve({ x: e2[0] - 6, y: e2[1] - 12, w: 12, h: 12 });
      g.push('<text x="' + (e2[0] + 4).toFixed(1) + '" y="' + (e2[1] - 3).toFixed(1) + '" font-size="10" fill="' + ax[1] + '" font-family="ui-monospace,SF Mono,Menlo,monospace">' + ax[2] + '</text>');
    });
    // 基座
    var b0 = SC([0, 0, 0]);
    g.push('<ellipse cx="' + b0[0].toFixed(1) + '" cy="' + b0[1].toFixed(1) + '" rx="' + (s * reach * 0.13).toFixed(1) + '" ry="' + (s * reach * 0.06).toFixed(1) + '" fill="#e6e1d6" stroke="#bbb"/>');

        '" stroke="' + (last ? '#ea2804' : '#202020') + '" stroke-width="' + (last ? 3 : 5.5) + '" stroke-linecap="round" opacity="' + (last ? 1 : 0.9) + '"/>');
    }
    for (i = 1; i < screen.length - 1; i++) {
      var isP = model.links[i - 1] && model.links[i - 1].type === 'P';
      var pp = screen[i];
      if (isP) g.push('<rect x="' + (pp[0] - 5).toFixed(1) + '" y="' + (pp[1] - 5).toFixed(1) + '" width="10" height="10" fill="#fff" stroke="#202020" stroke-width="1.6"/>');
      else g.push('<circle cx="' + pp[0].toFixed(1) + '" cy="' + pp[1].toFixed(1) + '" r="4.6" fill="#fff" stroke="#202020" stroke-width="1.6"/>');
    }
    // 关节短标：球形腕的后三轴在屏幕上落在同一点，分开标会互相挤掉（2026-09-15 人工看图发现
    // J5 被整条丢弃），所以重合的关节合并成一个区间标签。
    var groups = [];
    for (i = 1; i <= model.n; i++) {
      var pj = screen[i], hit = null;
      for (j = 0; j < groups.length; j++) {
        if (Math.abs(groups[j].x - pj[0]) < 4.5 && Math.abs(groups[j].y - pj[1]) < 4.5) { hit = groups[j]; break; }
      }

    var eo = SC(pe);
    [[0, '#ea2804', 'x'], [1, '#202020', 'y'], [2, '#8d8d8d', 'z']].forEach(function (a) {
      var dir = [Re[0][a[0]], Re[1][a[0]], Re[2][a[0]]];

      g.push('<line x1="' + eo[0].toFixed(1) + '" y1="' + eo[1].toFixed(1) + '" x2="' + e3[0].toFixed(1) + '" y2="' + e3[1].toFixed(1) + '" stroke="' + a[1] + '" stroke-width="2"/>');
      P.place(e3[0], e3[1], a[2], { size: 10, anchor: 'middle', kind: 'triad', offs: [[0, -5], [9, 3], [-9, 3], [0, 12]] });
    });
    g.push('<circle cx="' + eo[0].toFixed(1) + '" cy="' + eo[1].toFixed(1) + '" r="3.2" fill="#ea2804"/>');
    // 可操作度椭球（平移部分，投影成椭圆）

      var ax3 = RB.ellipsoid(model, q), smax = Math.max(ax3[0].len, 1e-9);

  // 不变量：用到 S.q 之前，它的长度必须等于当前 model 的自由度

  // ============ 轨迹规划 ============
  // 统一产出 {t(秒), q, qd, qdd, qddd, cart:bool, ikFail:int}
  function buildTraj() {
    var m = model, n = m.n, steps = Math.max(5, Math.min(400, S.trajSteps | 0)), T = Math.max(0.05, S.trajT);
    if (!S.trajFrom || S.trajFrom.length !== n) S.trajFrom = S.q.slice();
    if (!S.trajTo || S.trajTo.length !== n) S.trajTo = S.q.slice();
    var q0 = RB.clampQ(m, S.trajFrom.slice()), q1 = RB.clampQ(m, S.trajTo.slice());
    var out, i, j;
    if (S.trajKind === 'cartesian') {
      var T0 = RB.fk(m, q0), T1 = RB.fk(m, q1);
      var Ts = RB.ctraj(T0, T1, steps);
      var qs = [], prev = q0.slice(), fail = 0;
      for (i = 0; i < Ts.length; i++) {
        var sol = RB.ikLM(m, Ts[i], prev, { maxIter: 120, restarts: 1 });
        // 优先取限位内的解：越限了就从截断后的解重新收敛一次（带限位夹紧）
        if (sol.ok && !RB.inLimits(m, sol.q, 1e-6)) {
          var alt = RB.ikLM(m, Ts[i], RB.clampQ(m, sol.q), { maxIter: 120, clamp: true, restarts: 1 });
          if (alt.ok && RB.inLimits(m, alt.q, 1e-6)) sol = alt;
        }
        if (!sol.ok) fail++;
        prev = sol.q.slice();
        qs.push(prev.slice());
      }
      var dt = T / (steps - 1);
      out = { t: [], q: qs, qd: [], qdd: [], qddd: [], cart: true, ikFail: fail, poses: Ts };
      for (i = 0; i < steps; i++) out.t.push(dt * i);
      for (i = 0; i < steps; i++) {
        var v = [], a = [], jk = [];
        for (j = 0; j < n; j++) {
          var im = Math.max(0, i - 1), ip = Math.min(steps - 1, i + 1);
          v.push((qs[ip][j] - qs[im][j]) / ((ip - im) * dt || 1));
          a.push((qs[ip][j] - 2 * qs[i][j] + qs[im][j]) / (dt * dt));
          jk.push(0);
        }
        out.qd.push(v); out.qdd.push(a); out.qddd.push(jk);
      }
    } else if (S.trajKind === 'scurve') {
      var vm = [], am = [], jm = [];
      for (j = 0; j < n; j++) { vm.push(S.vmax); am.push(S.amax); jm.push(S.jmax); }
      var sc = RB.scurveTraj(q0, q1, steps, vm, am, jm);
      out = { t: sc.t.slice(), q: sc.q, qd: sc.qd, qdd: sc.qdd, qddd: sc.qddd, cart: false, ikFail: 0, T: sc.T, plans: sc.plans };
    } else {
      var raw = S.trajKind === 'trapezoid' ? RB.trapezoidalTraj(q0, q1, steps) : RB.jtraj(q0, q1, steps);
      out = { t: [], q: raw.q, qd: [], qdd: [], qddd: [], cart: false, ikFail: 0 };
      // 引擎给的是「归一化时间」下的导数，这里按用户设定的总时长换算回真实量纲
      for (i = 0; i < raw.q.length; i++) {
        out.t.push(raw.t[i] * T);
        out.qd.push(raw.qd[i].map(function (v2) { return v2 / T; }));
        out.qdd.push(raw.qdd[i].map(function (v2) { return v2 / (T * T); }));
        out.qddd.push(raw.qddd[i].map(function (v2) { return v2 / (T * T * T); }));
      }
    }
    return out;
  }

    P.reserve({ x: 2, y: 2, w: P.measure('力矩 N·m', 11).w, h: 14 });
    g.push('<text x="4" y="13" font-size="11" fill="#646464" font-family="ui-monospace,SF Mono,Menlo,monospace">力矩 N·m</text>');
    var Y = function (v) { return mT + ih - v / (top || 1) * ih; };

    var notes = [
      ['DH 约定', '标准 DH 为 A = Rz(θ)·Tz(d)·Tx(a)·Rx(α)；改进（Craig）DH 为 A = Rx(α)·Tx(a)·Rz(θ)·Tz(d)。' +
        '两种都支持，Panda 用的是改进 DH。'],
      ['姿态顺序', 'RPY 默认 ZYX（R = Rz(yaw)·Ry(pitch)·Rx(roll)），也给出 XYZ 顺序与 ZYZ 欧拉角；' +
        '四元数按 (w, x, y, z) 排列并统一取 w ≥ 0。'],
      ['可操作度', 'Yoshikawa 定义 sqrt(det(J·Jᵀ))。全 6 轴那一项量纲不一致（m/s 与 rad/s 混算），只可同构型比较。'],
      ['闭式逆解', '用 Paul & Zhang (1986) 的 Puma 560 解法，前提是 6 个转动关节 + 球形腕 + a₁ = 0 + α₁ = +90°。' +
        '本站实测：IRB 140（a₁ = 0.07 m、α₁ = −90°）与 KUKA KR5（a₁ = 0.18 m）套这套公式回代残差达 1.34 m，' +
        '所以它们被判为「闭式不适用」，改走数值多起点 + 腕部翻转补全。'],
      ['腕部翻转', '球形腕上 [q₄+π, −q₅, q₆+π] 是精确的等位姿变换，用它补全解集；每个解都做过正运动学回代校验（残差 < 1e−8）。'],
      ['动力学', '递归牛顿-欧拉，力矩含 G²·Jm·q̈ 的电机惯量项与 −(G²·B·q̇ + |G|·Tc·sign q̇) 的摩擦项，' +
        '可在「动力学」页关掉。M(q) 由单位加速度列法从同一套 RNE 里取出。'],
      ['末端负载', '与最后一根连杆按平行轴定理合成一个刚体（总质量相加、质心加权平均、惯量做平行轴修正），' +
        '不是简单替换连杆质量。'],
      ['S 曲线', '七段双 S 型（jerk 限幅）：先按速度/加速度/加加速度上限求各轴时间，再统一到最慢那一轴，' +
        '按各轴自身时间律线性缩放。端点速度与加速度严格为零。'],
      ['上游数据问题', 'roboticstoolbox 的 IRB140 模型里，连杆 2 的质心被写成 198.29e3 m（应为 198.29e−3），' +
        '连杆 3 的质心直接用了毫米数值没换算，照其原值算出的关节力矩达 1.4e11 N·m。' +
        '本站因此不采用该机型的公布惯性参数，动力学一律走均匀杆估算。这个问题是本页写对拍脚本时发现的。']
    ];
    var nl = el('div', 'rl-grid rl-g2');
    notes.forEach(function (nn) {
      var card = el('div', 'rl-card');
      card.appendChild(el('div', 'rl-h3', nn[0]));
      card.appendChild(el('div', 'rl-small', nn[1]));
      nl.appendChild(card);
    });
    p.appendChild(nl);

    p.appendChild(el('h2', 'rl-h2', '离线对拍规模'));
    p.appendChild(el('div', 'rl-note', '交付前这套引擎跑过 1,084,073 个标量对拍点、0 失配。' +
      '参照物：roboticstoolbox-python 1.4.3 的 C 版与纯 Python 版 rne、ikine_a、jtraj/trapezoidal/ctraj、fkine/jacob0/jacobe，' +
      'numpy 的 SVD 与行列式，pytransform3d 3.16 的姿态转换（另一位作者的独立实现），' +
      '以及一批不依赖任何实现的性质断言：有限差分雅可比、M 对称半正定、τ = Mq̈ + Cq̇ + g 回代、功率平衡、' +
      '平面 3R 三角闭式、教科书二连杆闭式、S 曲线积分自洽、机型文本打印器的 900 组往返 fuzz。'));
    p.appendChild(tableEl(['机型', '自由度', '关节类型', 'DH 约定', '惯性参数', '闭式逆解'],
      Object.keys(RB_MODELS).map(function (k) {
        var mm = RB_MODELS[k];
        return [mm.title, String(mm.n), mm.links.map(function (L) { return L.type; }).join(''),
          mm.mdh ? '改进' : '标准',
          mm.dyn ? (mm.dynFull ? '完整' : '部分 ' + mm.massLinks + '/' + mm.n) : '杆估算',
          RB.isPumaType(mm) ? '可用' : '数值'];
      }), { id: 'rl-model-table' }));
  }
  function wsSvg(ws, m) {
    var W = 660, H = 420, mL = 56, mR = 14, mT = 26, mB = 36;
    var iw = W - mL - mR, ih = H - mT - mB;
    var rmax = Math.max(ws.rmax, 1e-6), zlo = ws.zmin, zhi = ws.zmax;
    if (zhi - zlo < 1e-9) { zhi = zlo + 0.1; }
    var bound = RB.reachBound(m);
    var xhi = Math.max(rmax, bound) * 1.03;
    var yl = Math.min(zlo, -bound * 0.05), yh = Math.max(zhi, bound * 0.05);
    var X = function (v) { return mL + v / xhi * iw; };
    var Y = function (v) { return mT + ih - (v - yl) / (yh - yl) * ih; };
    var P = new Placer(W, H, 1.5), g = [];
    g.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#fff"/>');
    P.reserve({ x: 2, y: 2, w: P.measure('z（m）', 11).w, h: 14 });
    g.push('<text x="4" y="13" font-size="11" fill="#646464" font-family="ui-monospace,SF Mono,Menlo,monospace">z（m）</text>');
    var xt = niceTicks(0, xhi, 6), yt = niceTicks(yl, yh, 6), i;
    for (i = 0; i < yt.length; i++) {
      var yy = Y(yt[i]);
      g.push('<line x1="' + mL + '" y1="' + yy.toFixed(1) + '" x2="' + (mL + iw) + '" y2="' + yy.toFixed(1) + '" stroke="rgba(32,32,32,.08)"/>');
      P.place(mL - 6, yy + 3.5, fmt(yt[i], 2), { size: 10, anchor: 'end', offs: [[0, 0], [0, -11], [0, 11]], kind: 'ytick' });
    }
    for (i = 0; i < xt.length; i++) {
      var xx = X(xt[i]);
      g.push('<line x1="' + xx.toFixed(1) + '" y1="' + mT + '" x2="' + xx.toFixed(1) + '" y2="' + (mT + ih) + '" stroke="rgba(32,32,32,.06)"/>');
      P.place(xx, mT + ih + 14, fmt(xt[i], 2), { size: 10, anchor: 'middle', offs: [[0, 0], [0, 12]], kind: 'xtick' });
    }
    // 可达格点
    var cw = ws.cw, ch = ws.ch;
    Object.keys(ws.cells).forEach(function (key) {
      var parts = key.split(','), cx = +parts[0], cy = +parts[1];
      var r0 = cx * cw, z0 = ws.zmin + cy * ch;
      var x0 = X(r0), x1 = X(r0 + cw), y1 = Y(z0), y0 = Y(z0 + ch);
      g.push('<rect x="' + x0.toFixed(1) + '" y="' + y0.toFixed(1) + '" width="' + Math.max(1, x1 - x0).toFixed(1) +
        '" height="' + Math.max(1, y1 - y0).toFixed(1) + '" fill="rgba(234,40,4,.5)"/>');
    });
    // 连杆长度之和的圆弧（上界）
    var arc = [];
    for (i = 0; i <= 60; i++) {
      var th = -Math.PI / 2 + i / 60 * Math.PI;
      var rr2 = bound * Math.cos(th), zz = bound * Math.sin(th);
      if (rr2 < 0) continue;
      arc.push(X(rr2).toFixed(1) + ',' + Y(zz).toFixed(1));
    }
    g.push('<polyline points="' + arc.join(' ') + '" fill="none" stroke="#8d8d8d" stroke-width="1.3" stroke-dasharray="5 4"/>');
    g.push('<line x1="' + mL + '" y1="' + Y(0).toFixed(1) + '" x2="' + (mL + iw) + '" y2="' + Y(0).toFixed(1) + '" stroke="#202020" stroke-width="1"/>');
    g.push('<line x1="' + mL + '" y1="' + mT + '" x2="' + mL + '" y2="' + (mT + ih) + '" stroke="#202020" stroke-width="1"/>');
    var lb = P.measure('水平半径 r（m）', 10);
    P.reserve({ x: W - lb.w - 4, y: H - 14, w: lb.w, h: 12 });
    g.push('<text x="' + (W - 4) + '" y="' + (H - 4) + '" text-anchor="end" font-size="10" fill="#646464" font-family="ui-monospace,SF Mono,Menlo,monospace">水平半径 r（m）</text>');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="工作空间 r-z 截面">' + g.join('') + P.svg('#575757') + '</svg>';
  }

  // 能力清单：逐项现场跑一遍（2026-08-28 教训：页面上列出来的就是承诺，必须逐项验）
  function runCapabilities() {
    var m = model, q = S.q, em = effectiveModel(), out = [];
    function add(name, fn) {
      try {
        var v = fn();
        out.push({ name: name, value: v == null ? '未命中' : String(v), ok: v != null });
      } catch (e) {
        out.push({ name: name, value: '未命中（' + e.message + '）', ok: false });
      }
    }
    add('正运动学 T0n', function () { var p = RB.transOf(RB.fk(m, q)); return '末端 (' + fmt(p[0], 4) + ', ' + fmt(p[1], 4) + ', ' + fmt(p[2], 4) + ') m'; });
    add('逐关节坐标系', function () { return RB.fkFrames(m, q).length + ' 个变换（含基座与工具）'; });
    add('标准 / 改进 DH 双约定', function () { return m.mdh ? '当前机型走改进 DH' : '当前机型走标准 DH'; });
    add('移动关节支持', function () {
      var np = m.links.filter(function (L) { return L.type === 'P'; }).length;
      return np + ' 个移动关节 / ' + m.n + ' 轴';
    });
    add('RPY（ZYX）', function () { return RB.tr2rpy(RB.rotOf(RB.fk(m, q)), 'zyx').map(function (v) { return fmt(v * R2D, 2); }).join(', ') + ' °'; });
    add('RPY（XYZ）', function () { return RB.tr2rpy(RB.rotOf(RB.fk(m, q)), 'xyz').map(function (v) { return fmt(v * R2D, 2); }).join(', ') + ' °'; });
    add('ZYZ 欧拉角', function () { return RB.tr2eul(RB.rotOf(RB.fk(m, q)), false).map(function (v) { return fmt(v * R2D, 2); }).join(', ') + ' °'; });
    add('四元数', function () { return RB.r2quat(RB.rotOf(RB.fk(m, q))).map(function (v) { return fmt(v, 4); }).join(', '); });
    add('轴角', function () { var a = RB.tr2angvec(RB.rotOf(RB.fk(m, q))); return fmt(a.angle * R2D, 2) + '° 绕 (' + a.axis.map(function (v) { return fmt(v, 3); }).join(', ') + ')'; });
    add('世界系雅可比 J0', function () { var J = RB.jacob0(m, q); return J.length + '×' + J[0].length; });
    add('末端系雅可比 Je', function () { var J = RB.jacobe(m, q); return J.length + '×' + J[0].length; });
    add('奇异值分解', function () { return RB.svdVals(RB.jacob0(m, q)).slice(0, 3).map(function (v) { return fmt(v, 4); }).join(' / ') + ' …'; });
    add('条件数', function () { var c = RB.jacobMetrics(m, q, 'trans').cond; return isFinite(c) ? fmt(c, 2) : '∞（奇异）'; });
    add('Yoshikawa 可操作度', function () { return fmt(RB.manipulability(m, q, 'trans'), 6); });
    add('可操作度椭球主轴', function () { return RB.ellipsoid(m, q).map(function (e) { return fmt(e.len, 4); }).join(' / '); });
    add('数值逆解（LM）', function () {
      var T = RB.fk(m, q), s = RB.ikLM(m, T, q.map(function (v, j) { return v + (j % 2 ? 0.2 : -0.2); }), { maxIter: 200 });
      return (s.ok ? '收敛 ' : '未收敛 ') + s.iters + ' 次迭代，残差 ' + s.err.toExponential(1);
    });
    add('全部逆解', function () { return RB.ikAll(m, RB.fk(m, q), { seeds: 64 }).length + ' 个解'; });
    add('Puma 型闭式 8 解', function () {
      if (!RB.isPumaType(m)) return '当前机型不适用（需 a₁=0 且 α₁=+90°）';
      var got = RB.CONFIGS.filter(function (c) { return RB.ikine6s(m, RB.fk(m, q), c); }).length;
      return got + ' / 8 个构型';
    });
    add('腕部翻转等位姿变换', function () { return RB.isSpherical(m) ? '球形腕，可用' : '非球形腕，不可用'; });
    add('自由度掩码逆解', function () {
      var s = RB.ikLM(m, RB.fk(m, q), q.map(function (v) { return v + 0.15; }), { mask: [1, 1, 1, 0, 0, 0], maxIter: 150 });
      return '只约束位置时残差 ' + s.err.toExponential(1);
    });
    add('五次多项式轨迹', function () { var t = RB.jtraj(S.trajFrom, S.trajTo, 20); return t.q.length + ' 点，端点速度 ' + fmt(RB.norm(t.qd[0]), 1); });
    add('梯形速度轨迹（LSPB）', function () { var t = RB.trapezoidalTraj(S.trajFrom, S.trajTo, 20); return t.q.length + ' 点'; });
    add('S 曲线（jerk 限幅）', function () {
      var vm = [], am = [], jm = [], j;
      for (j = 0; j < m.n; j++) { vm.push(S.vmax); am.push(S.amax); jm.push(S.jmax); }
      var t = RB.scurveTraj(S.trajFrom, S.trajTo, 20, vm, am, jm);
      return '总时长 ' + fmt(t.T, 3) + ' s';
    });
    add('笛卡尔直线 + SLERP', function () {
      var Ts = RB.ctraj(RB.fk(m, S.trajFrom), RB.fk(m, S.trajTo), 10);
      return Ts.length + ' 个位姿，姿态用四元数 SLERP';
    });
    add('递归牛顿-欧拉力矩', function () {
      var t = RB.rne(em, q, RB.zeros(m.n).map(function () { return 0.2; }), RB.zeros(m.n).map(function () { return 0.3; }),
        { motor: S.useMotor, coulomb: S.useFric, friction: S.useFric });
      return '最大 |τ| = ' + fmt(Math.max.apply(null, t.map(Math.abs)), 3) + ' N·m';
    });
    add('质量矩阵 M(q)', function () { var M2 = RB.inertia(em, q); return M2.length + '×' + M2.length + '，M11 = ' + fmt(M2[0][0], 4); });
    add('重力载荷 g(q)', function () { return '最大 ' + fmt(Math.max.apply(null, RB.gravload(em, q).map(Math.abs)), 3) + ' N·m'; });
    add('离心与科氏项 C(q,q̇)q̇', function () {
      var c = RB.coriolisTau(em, q, RB.zeros(m.n).map(function () { return 0.5; }));
      return '最大 ' + fmt(Math.max.apply(null, c.map(Math.abs)), 4) + ' N·m';
    });
    add('电机惯量与摩擦', function () {
      var a = RB.rne(em, q, RB.zeros(m.n).map(function () { return 0.4; }), RB.zeros(m.n), { motor: true, coulomb: true });
      var b = RB.rne(em, q, RB.zeros(m.n).map(function () { return 0.4; }), RB.zeros(m.n), { motor: false, coulomb: false, friction: false });
      return '两者之差最大 ' + fmt(Math.max.apply(null, a.map(function (v, i) { return Math.abs(v - b[i]); })), 4) + ' N·m';
    });
    add('末端负载合成', function () {
      var pl = RB.withPayload(em, 5, [0, 0, 0.1]);
      return '挂 5 kg 后末端连杆质量 ' + fmt(pl.links[m.n - 1].m, 3) + ' kg';
    });
    add('均匀杆惯性估算', function () {
      var r = RB.rodEstimate(m, S.rho);
      return '估算总质量 ' + fmt(r.links.reduce(function (a, L) { return a + L.m; }, 0), 3) + ' kg';
    });
    add('工作空间采样', function () { var w = RB.workspaceRZ(m, { samples: 800, grid: 24 }); return '最大半径 ' + fmt(w.rmax, 4) + ' m'; });
    add('机型文本往返', function () {
      var txt = RBDSL.printModel(m), pr = RBDSL.parseModel(txt);
      if (!pr.model) return null;
      var d = 0, T1 = RB.fk(m, q), T2 = RB.fk(pr.model, q), i2, j2;
      for (i2 = 0; i2 < 4; i2++) for (j2 = 0; j2 < 4; j2++) d = Math.max(d, Math.abs(T1[i2][j2] - T2[i2][j2]));
      return '打印再解析后 FK 偏差 ' + d.toExponential(1);
    });
    return out;
  }

  // ============ 启动 ============
  load();
  if (!RB_MODELS[S.modelKey] && S.modelKey !== 'custom') S.modelKey = 'puma560';
  if (S.modelKey === 'custom' && S.dhText) {
    var pr0 = RBDSL.parseModel(S.dhText);
    if (pr0.model) customModel = pr0.model;
    else S.modelKey = 'puma560';
  }
  setModel(S.modelKey, { keepQ: true });
  if (!S.dhText) S.dhText = RBDSL.printModel(model);
  buildShell();
  showTab();
  window.RL_DEBUG = { S: S, get model() { return model; }, RB: RB, RBDSL: RBDSL, buildTraj: buildTraj,
    runCapabilities: runCapabilities, Placer: Placer, lineChart: lineChart, robotSvg: robotSvg };
})();
</script>
</body>
</html>
