<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>照片信息工坊 · EXIF Studio</title>
<meta name="description" content="批量修正照片拍摄时间、按 GPX 轨迹或手机照片补定位、一键清除 GPS 与序列号、按时间重命名；JPEG / HEIC / PNG / WebP / RAW 全在本机改，不重编码、不上传。">
<style>
[hidden]{display:none!important}
:root{
  --ex-blue:#3E6AE1; --ex-blue-d:#3457b1; --ex-carbon:#171A20; --ex-graphite:#393C41; --ex-pewter:#5C5E62;
  --ex-fog:#8E8E8E; --ex-cloud:#EEEEEE; --ex-pale:#D0D1D2; --ex-ash:#F4F4F4; --ex-white:#FFFFFF;
  --ex-t:.33s cubic-bezier(.5,0,0,.75);
  --ex-font:"Universal Sans Text",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --ex-display:"Universal Sans Display",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --ex-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ex-font);font-size:14px;line-height:20px;color:var(--ex-graphite);background:var(--ex-white);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.ex-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── 导航：毛玻璃白，无阴影无边框 ── */
.ex-nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;min-height:56px;padding:0 24px;background:rgba(255,255,255,.75);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px)}
.ex-back{color:var(--ex-carbon);font-weight:500;text-decoration:none;white-space:nowrap;padding:6px 8px;border-radius:4px;transition:background-color var(--ex-t)}
.ex-back:hover{background:var(--ex-ash)}
.ex-mark{font-weight:500;color:var(--ex-carbon);letter-spacing:.32em;font-size:14px;white-space:nowrap}
.ex-tabs{display:flex;gap:4px;margin:0 auto;min-width:0;flex:0 1 auto;overflow-x:auto;position:relative;justify-content:safe center;scrollbar-width:none}
.ex-tabs::-webkit-scrollbar{display:none}
.ex-tab{flex:0 0 auto;border:0;background:transparent;color:var(--ex-carbon);font-weight:500;font-size:14px;line-height:16.8px;min-height:32px;padding:4px 16px;border-radius:4px;cursor:pointer;transition:color var(--ex-t),background-color var(--ex-t)}
.ex-tab:hover{background:rgba(23,26,32,.05)}
.ex-tab[aria-selected="true"]{background:var(--ex-ash)}
.ex-tab:focus-visible,.ex-btn:focus-visible,.ex-chip:focus-visible,.ex-card:focus-visible,.ex-link:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--ex-carbon)}
.ex-tab .ex-badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--ex-carbon);color:#fff;font-size:11px;line-height:18px;text-align:center}
.ex-nav-r{display:flex;gap:8px;white-space:nowrap;flex:0 0 auto}
.ex-back{flex:0 0 auto}

/* ── 按钮：4px 圆角，只有主按钮用蓝 ── */
.ex-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;min-width:56px;padding:4px 16px;border:3px solid transparent;border-radius:4px;font-weight:500;font-size:14px;line-height:16.8px;cursor:pointer;background:var(--ex-white);color:var(--ex-graphite);transition:border-color var(--ex-t),background-color var(--ex-t),color var(--ex-t),box-shadow .25s}
.ex-btn:hover{background:var(--ex-ash)}
.ex-btn-p{background:var(--ex-blue);color:#fff}
.ex-btn-p:hover{background:var(--ex-blue-d)}
.ex-btn-p:focus-visible{box-shadow:inset 0 0 0 2px #fff,0 0 0 2px var(--ex-blue)}
.ex-btn-ash{background:var(--ex-ash);color:var(--ex-carbon)}
.ex-btn-ash:hover{background:var(--ex-cloud)}
.ex-btn-wide{width:200px}
.ex-btn[disabled]{opacity:.45;cursor:not-allowed}
.ex-btn-sm{min-height:32px;padding:2px 12px;border-width:2px}
.ex-link{border:0;background:none;padding:2px 0;color:var(--ex-pewter);cursor:pointer;text-decoration:none;border-radius:2px;transition:box-shadow var(--ex-t),color var(--ex-t)}
.ex-link:hover{color:var(--ex-carbon);box-shadow:inset 0 -1px 0 currentColor}

/* ── Hero：整幅摄影，UI 只占一点点 ── */
.ex-hero{position:relative;height:min(76vh,720px);min-height:420px;overflow:hidden;background:var(--ex-carbon);color:#fff}
.ex-hero.ex-has{height:min(50vh,540px);min-height:380px}
.ex-hero-cv,.ex-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ex-hero-copy{position:absolute;left:0;right:0;top:12%;text-align:center;padding:0 24px}
.ex-hero h1{margin:0;font-family:var(--ex-display);font-weight:500;font-size:40px;line-height:48px;color:#fff;letter-spacing:normal}
.ex-hero-sub{margin:8px 0 0;font-size:17px;line-height:24px;color:rgba(255,255,255,.92)}
.ex-cta{display:flex;gap:24px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.ex-hero-note{margin-top:14px;font-size:14px;color:rgba(255,255,255,.78)}
.ex-hero-meta{position:absolute;left:24px;right:24px;bottom:24px;display:flex;gap:24px;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:4px;background:rgba(255,255,255,.75);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);color:var(--ex-carbon);min-width:0}
.ex-hero-meta .ex-hm-l{min-width:0}
.ex-hm-name{font-size:17px;line-height:20px;font-weight:500;color:var(--ex-carbon);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-hm-line{margin-top:4px;color:var(--ex-graphite);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-hm-r{display:flex;gap:8px;flex:0 0 auto}
.ex-arrow{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border:0;border-radius:4px;background:rgba(255,255,255,.55);color:var(--ex-carbon);font-size:20px;cursor:pointer;transition:background-color var(--ex-t)}
.ex-arrow:hover{background:rgba(255,255,255,.85)}
.ex-arrow-l{left:16px}.ex-arrow-r{right:16px}
.ex-dots{position:absolute;left:0;right:0;bottom:100px;display:flex;gap:8px;justify-content:center}
.ex-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);border:0;padding:0;cursor:pointer}
.ex-dot[aria-current="true"]{background:#fff}
.ex-drop{position:absolute;inset:16px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(23,26,32,.55);color:#fff;font-size:22px;font-weight:500;pointer-events:none}

/* ── 主区 ── */
.ex-main{max-width:1383px;margin:0 auto;padding:40px 24px 120px;min-width:0}
.ex-pane{min-width:0}
.ex-h2{margin:0;font-family:var(--ex-display);font-size:28px;line-height:34px;font-weight:500;color:var(--ex-carbon)}
.ex-h3{margin:0;font-size:17px;line-height:20px;font-weight:500;color:var(--ex-carbon)}
.ex-lead{margin:8px 0 0;color:var(--ex-pewter);max-width:760px}
.ex-sect{margin-top:48px}
.ex-sect:first-child{margin-top:0}
.ex-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ex-sp{flex:1 1 auto}
.ex-surface{background:var(--ex-ash);border-radius:12px;padding:24px;min-width:0}
.ex-grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.ex-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.ex-muted{color:var(--ex-pewter)}
.ex-fog{color:var(--ex-fog)}
.ex-mono{font-family:var(--ex-mono);font-size:13px}
.ex-empty{padding:56px 0;text-align:center;color:var(--ex-pewter)}

/* 控件 */
.ex-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.ex-field > span{color:var(--ex-pewter)}
.ex-in,.ex-sel{height:40px;min-width:120px;padding:0 12px;border:1px solid var(--ex-pale);border-radius:4px;background:#fff;color:var(--ex-carbon);transition:border-color var(--ex-t)}
.ex-in::placeholder{color:var(--ex-fog)}
.ex-in:focus,.ex-sel:focus{outline:none;border-color:var(--ex-carbon)}
.ex-in.ex-bad{border-color:#b3261e}
.ex-check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:24px}
.ex-check input{width:18px;height:18px;margin:0;accent-color:var(--ex-carbon)}
.ex-chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;min-width:56px;padding:4px 12px;border:0;border-radius:4px;background:#fff;color:var(--ex-carbon);cursor:pointer;transition:background-color var(--ex-t),color var(--ex-t);white-space:nowrap;flex:0 0 auto}
.ex-surface .ex-chip{background:#fff}
.ex-chip:hover{background:var(--ex-cloud)}
.ex-chip[aria-pressed="true"]{background:var(--ex-carbon);color:#fff}
.ex-chip .ex-n{font-variant-numeric:tabular-nums;color:inherit;opacity:.7}
.ex-err{color:#b3261e}
.ex-note{padding:12px 16px;border-radius:4px;background:var(--ex-ash);color:var(--ex-graphite)}

/* 照片网格：大圆角摄影卡，文字在下方 */
.ex-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px 16px;margin-top:24px}
.ex-card{display:block;border:0;padding:0;background:none;text-align:left;cursor:pointer;border-radius:12px;min-width:0}
.ex-card-img{position:relative;aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:var(--ex-ash)}
.ex-card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ex-card-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ex-fog);font-weight:500}
.ex-card[aria-current="true"] .ex-card-img{box-shadow:inset 0 0 0 3px var(--ex-carbon)}
.ex-card[aria-current="true"] .ex-card-img img{outline:3px solid var(--ex-carbon);outline-offset:-3px}
.ex-card-t{margin-top:10px;font-weight:500;color:var(--ex-carbon);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-card-s{color:var(--ex-pewter);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ex-tagc{display:inline-block;padding:0 6px;border-radius:4px;background:var(--ex-ash);color:var(--ex-graphite);font-size:12px;line-height:20px;white-space:nowrap}
.ex-tagc.ex-dk{background:var(--ex-carbon);color:#fff}
.ex-sel-box{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:4px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center}
.ex-sel-box input{width:18px;height:18px;margin:0;accent-color:var(--ex-carbon)}

/* 表格：只有发丝线 */
.ex-tw{position:relative;overflow:auto;max-width:100%;min-width:0}
.ex-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ex-table th{font-weight:500;color:var(--ex-pewter);text-align:left;padding:10px 12px;border-bottom:1px solid var(--ex-cloud);white-space:nowrap}
.ex-table td{padding:10px 12px;border-bottom:1px solid var(--ex-cloud);vertical-align:top;color:var(--ex-graphite)}
.ex-table td.ex-k{color:var(--ex-carbon);font-weight:500;white-space:nowrap}
.ex-table tr.ex-chg td{background:#fafafa}
.ex-table .ex-old{color:var(--ex-fog);text-decoration:line-through}
.ex-table .ex-new{color:var(--ex-carbon);font-weight:500}
.ex-val{word-break:break-all}
.ex-dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 24px;margin:0}
.ex-dl dt{color:var(--ex-pewter)}
.ex-dl dd{margin:0;color:var(--ex-carbon);min-width:0;overflow-wrap:anywhere}
.ex-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:24px}
.ex-kpi{background:var(--ex-ash);border-radius:12px;padding:18px 20px;min-width:0}
.ex-kpi b{display:block;font-family:var(--ex-display);font-size:28px;line-height:34px;font-weight:500;color:var(--ex-carbon);font-variant-numeric:tabular-nums}
.ex-kpi span{color:var(--ex-pewter)}
.ex-detail{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;margin-top:48px}
.ex-thumbcmp{display:flex;gap:12px;margin-top:12px}
.ex-thumbcmp img{width:120px;height:80px;object-fit:cover;border-radius:4px;background:var(--ex-ash)}

/* 设备卡（时间页） */
.ex-devs{display:grid;gap:24px;margin-top:24px}
.ex-dev{background:var(--ex-ash);border-radius:12px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;min-width:0}
.ex-dev-ctl{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.ex-wiz{grid-column:1 / -1;background:#fff;border-radius:4px;padding:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;min-width:0}
.ex-wiz .ex-field{flex:1 1 220px;min-width:0}
.ex-wiz .ex-sel,.ex-wiz .ex-in{width:100%}
.ex-sel{max-width:100%}
.ex-dev-ctl .ex-field{min-width:0}
.ex-fig{width:100%;height:auto;display:block}
.ex-figbox{position:relative;margin-top:16px;background:#fff;border-radius:12px;min-width:0}
.ex-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;color:var(--ex-pewter)}
.ex-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* 底部常驻条 */
.ex-bar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:16px;align-items:center;padding:12px 24px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--ex-cloud)}
.ex-bar-s{flex:1 1 auto;min-width:0;color:var(--ex-graphite);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-bar-s b{color:var(--ex-carbon);font-weight:500}
.ex-toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:40;padding:10px 16px;border-radius:4px;background:var(--ex-carbon);color:#fff;max-width:min(90vw,560px)}
.ex-prog{height:4px;background:var(--ex-cloud);border-radius:2px;overflow:hidden;margin-top:12px}
.ex-prog i{display:block;height:100%;background:var(--ex-carbon);width:0;transition:width .2s}

@media (max-width:1100px){.ex-mark{display:none}}
@media (max-width:1024px){
  .ex-detail{grid-template-columns:minmax(0,1fr)}
  .ex-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ex-grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (max-width:767px){
  .ex-nav{flex-wrap:wrap;padding:8px 16px;gap:8px}
  .ex-mark{display:none}
  .ex-tabs{order:3;width:100%;margin:0;overflow-x:auto;position:relative;scrollbar-width:none}
  .ex-tabs::-webkit-scrollbar{display:none}
  .ex-nav-r{margin-left:auto}
  .ex-hero{height:auto;min-height:520px}
  .ex-hero.ex-has{min-height:440px}
  .ex-hero h1{font-size:28px;line-height:34px}
  .ex-hero-sub{font-size:15px}
  .ex-cta{flex-direction:column;align-items:center;gap:12px}
  .ex-hero-meta{flex-direction:column;align-items:stretch;gap:10px;left:12px;right:12px;bottom:12px}
  .ex-hm-r{justify-content:flex-start}
  .ex-dots{bottom:150px}
  .ex-main{padding:28px 16px 140px}
  .ex-grid2,.ex-grid3{grid-template-columns:minmax(0,1fr)}
  .ex-dev{grid-template-columns:minmax(0,1fr)}
  .ex-photos{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
  .ex-bar{padding:10px 16px}
  .ex-h2{font-size:24px;line-height:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="ex-nav" id="ex-nav">
  <a class="ex-back" href="../../">← 返回工具集</a>
  <span class="ex-mark" aria-hidden="true">EXIF STUDIO</span>
  <nav class="ex-tabs" id="ex-tabs" role="tablist" aria-label="功能">
    <button class="ex-tab" role="tab" id="ex-tab-photos" data-tab="photos" aria-controls="ex-pane-photos" aria-selected="true">照片</button>
    <button class="ex-tab" role="tab" id="ex-tab-time" data-tab="time" aria-controls="ex-pane-time" aria-selected="false" tabindex="-1">时间</button>
    <button class="ex-tab" role="tab" id="ex-tab-geo" data-tab="geo" aria-controls="ex-pane-geo" aria-selected="false" tabindex="-1">定位</button>
    <button class="ex-tab" role="tab" id="ex-tab-privacy" data-tab="privacy" aria-controls="ex-pane-privacy" aria-selected="false" tabindex="-1">隐私</button>
    <button class="ex-tab" role="tab" id="ex-tab-rename" data-tab="rename" aria-controls="ex-pane-rename" aria-selected="false" tabindex="-1">重命名</button>
    <button class="ex-tab" role="tab" id="ex-tab-export" data-tab="export" aria-controls="ex-pane-export" aria-selected="false" tabindex="-1">导出</button>
  </nav>
  <div class="ex-nav-r"><button class="ex-tab" id="ex-add" type="button">添加照片</button></div>
</header>

<section class="ex-hero" id="ex-hero" aria-label="照片预览">
  <canvas class="ex-hero-cv" id="ex-hero-cv" aria-hidden="true"></canvas>
  <img class="ex-hero-img" id="ex-hero-img" alt="" hidden>
  <div class="ex-hero-copy" id="ex-hero-copy">
    <h1 id="ex-hero-title">照片信息工坊</h1>
    <p class="ex-hero-sub">改拍摄时间、补拍摄地点、清掉定位和序列号，全在本机完成，不上传</p>
    <div class="ex-cta">
      <button class="ex-btn ex-btn-p ex-btn-wide" id="ex-pick" type="button">选择照片</button>
      <button class="ex-btn ex-btn-wide" id="ex-demo" type="button">载入示例</button>
    </div>
    <div class="ex-hero-note">支持 JPEG · HEIC · PNG · WebP · AVIF · DNG / CR2 / CR3 / NEF / ARW / RAF 等，也可以把整个文件夹拖进来</div>
  </div>
  <button class="ex-arrow ex-arrow-l" id="ex-prev" type="button" aria-label="上一张" hidden>‹</button>
  <button class="ex-arrow ex-arrow-r" id="ex-next" type="button" aria-label="下一张" hidden>›</button>
  <div class="ex-dots" id="ex-dots" hidden></div>
  <div class="ex-hero-meta" id="ex-hero-meta" hidden>
    <div class="ex-hm-l"><div class="ex-hm-name" id="ex-hm-name"></div><div class="ex-hm-line" id="ex-hm-line"></div><div class="ex-hm-line" id="ex-hm-line2"></div></div>
    <div class="ex-hm-r"><button class="ex-btn ex-btn-sm" id="ex-hm-detail" type="button">查看全部信息</button></div>
  </div>
  <div class="ex-drop" id="ex-drop" hidden>松手即可载入（文件不会离开这台设备）</div>
</section>

<main class="ex-main" id="ex-main">
  <div id="ex-panes">
    <section class="ex-pane" id="ex-pane-photos" role="tabpanel" aria-labelledby="ex-tab-photos"></section>
    <section class="ex-pane" id="ex-pane-time" role="tabpanel" aria-labelledby="ex-tab-time" hidden></section>
    <section class="ex-pane" id="ex-pane-geo" role="tabpanel" aria-labelledby="ex-tab-geo" hidden></section>
    <section class="ex-pane" id="ex-pane-privacy" role="tabpanel" aria-labelledby="ex-tab-privacy" hidden></section>
    <section class="ex-pane" id="ex-pane-rename" role="tabpanel" aria-labelledby="ex-tab-rename" hidden></section>
    <section class="ex-pane" id="ex-pane-export" role="tabpanel" aria-labelledby="ex-tab-export" hidden></section>
  </div>
</main>

<div class="ex-bar" id="ex-bar" role="region" aria-label="待写入的修改">
  <div class="ex-bar-s" id="ex-bar-s">还没有照片</div>
  <button class="ex-btn ex-btn-p" id="ex-bar-go" type="button" disabled>导出</button>
</div>
<div class="ex-toast" id="ex-toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="ex-file" multiple hidden accept="image/*,.heic,.heif,.avif,.dng,.cr2,.cr3,.nef,.nrw,.arw,.sr2,.raf,.rw2,.orf,.pef,.srw,.tif,.tiff,.webp,.png,.jpg,.jpeg,.jxl,.iiq,.gpx,.kml,.nmea,.csv,.json">
<input type="file" id="ex-track-file" multiple hidden accept=".gpx,.kml,.nmea,.nma,.csv,.json,.txt,.log">
